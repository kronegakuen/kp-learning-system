<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>カードプレビュー（名言なし）</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;}
body{background:#060D1A;display:flex;gap:24px;justify-content:center;align-items:flex-start;padding:32px 16px;flex-wrap:wrap;}
.label{font-size:12px;color:#7A9CC0;text-align:center;margin-bottom:8px;font-family:sans-serif;}
.card{background:#0F2240;border-radius:16px;padding:20px;width:320px;}
.card.gold{border:2px solid #EF9F27;}
.card.blue{border:1px solid #3A5E9A;}
</style>
<link href="https://fonts.googleapis.com/css2?family=BIZ+UDPGothic:wght@400;700&display=swap" rel="stylesheet">
</head>
<body>

<!-- パーフェクト（現在：名言あり） -->
<div>
  <div class="label">▼ 現在（名言あり）</div>
  <div class="card gold">
    <div style="font-size:20px;font-weight:500;color:#EF9F27;margin-bottom:2px;">🏆 パーフェクト！</div>
    <div style="font-size:56px;font-weight:500;color:#EF9F27;line-height:1.0;">100%</div>
    <div style="font-size:16px;color:#B0C4DE;margin-bottom:14px;">10 / 10問正解</div>
    <div style="background:#1A3260;padding:12px;margin-bottom:14px;border-left:3px solid #EF9F27;">
      <div style="font-size:11px;color:#7A9CC0;margin-bottom:4px;">— 松下幸之助</div>
      <div style="font-size:13px;color:#EAF1FA;line-height:1.6;text-align:left;">知識は力なり。学べば学ぶほど、自分が何も知らないことがわかる。</div>
    </div>
    <div style="font-size:14px;color:#EF9F27;margin-bottom:14px;">完璧！この調子で次のテキストも制覇しよう！</div>
    <div style="display:flex;gap:8px;justify-content:center;">
      <div style="background:#0C1B33;border-radius:8px;padding:8px 14px;text-align:center;flex:1;">
        <div style="font-size:16px;font-weight:500;color:#EF9F27;">5日</div>
        <div style="font-size:10px;color:#7A9CC0;">連続学習</div>
      </div>
      <div style="background:#0C1B33;border-radius:8px;padding:8px 14px;text-align:center;flex:1;">
        <div style="font-size:16px;font-weight:500;color:#EF9F27;">120問</div>
        <div style="font-size:10px;color:#7A9CC0;">累計達成</div>
      </div>
    </div>
  </div>
</div>

<!-- パーフェクト（名言なし） -->
<div>
  <div class="label">▼ 名言なし</div>
  <div class="card gold">
    <div style="font-size:20px;font-weight:500;color:#EF9F27;margin-bottom:2px;">🏆 パーフェクト！</div>
    <div style="font-size:56px;font-weight:500;color:#EF9F27;line-height:1.0;">100%</div>
    <div style="font-size:16px;color:#B0C4DE;margin-bottom:14px;">10 / 10問正解</div>
    <div style="font-size:14px;color:#EF9F27;margin-bottom:14px;">完璧！この調子で次のテキストも制覇しよう！</div>
    <div style="display:flex;gap:8px;justify-content:center;">
      <div style="background:#0C1B33;border-radius:8px;padding:8px 14px;text-align:center;flex:1;">
        <div style="font-size:16px;font-weight:500;color:#EF9F27;">5日</div>
        <div style="font-size:10px;color:#7A9CC0;">連続学習</div>
      </div>
      <div style="background:#0C1B33;border-radius:8px;padding:8px 14px;text-align:center;flex:1;">
        <div style="font-size:16px;font-weight:500;color:#EF9F27;">120問</div>
        <div style="font-size:10px;color:#7A9CC0;">累計達成</div>
      </div>
    </div>
  </div>
</div>

<!-- もう一步（名言なし） -->
<div>
  <div class="label">▼ 名言なし（低スコア）</div>
  <div class="card blue">
    <div style="font-size:20px;font-weight:500;color:#85B7EB;margin-bottom:2px;">もう一歩！</div>
    <div style="font-size:56px;font-weight:500;color:#85B7EB;line-height:1.0;">60%</div>
    <div style="font-size:16px;color:#B0C4DE;margin-bottom:14px;">6 / 10問正解</div>
    <div style="font-size:14px;color:#85B7EB;margin-bottom:14px;">もう一度挑戦して、80%を目指そう！</div>
    <div style="display:flex;gap:8px;justify-content:center;">
      <div style="background:#0C1B33;border-radius:8px;padding:8px 14px;text-align:center;flex:1;">
        <div style="font-size:16px;font-weight:500;color:#EF9F27;">3日</div>
        <div style="font-size:10px;color:#7A9CC0;">連続学習</div>
      </div>
      <div style="background:#0C1B33;border-radius:8px;padding:8px 14px;text-align:center;flex:1;">
        <div style="font-size:16px;font-weight:500;color:#EF9F27;">45問</div>
        <div style="font-size:10px;color:#7A9CC0;">累計達成</div>
      </div>
    </div>
  </div>
</div>

</body>
</html>

<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>KRONE Prep</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;}
:root{--nv9:#060D1A;--nv8:#0C1B33;--nv7:#0F2240;--nv6:#1A3260;--nv5:#2A4A80;--gold:#BA7517;--gL:#EF9F27;--tb:#EAF1FA;--tm:#B0C4DE;--tmu:#7A9CC0;}
body{font-family:'Hiragino Sans','Meiryo',sans-serif;background:var(--nv9);color:var(--tb);min-height:100vh;}
.wrap{max-width:680px;margin:0 auto;padding:1.5rem 1rem;}
.sec{display:none;}.sec.on{display:block;}
.hd{display:flex;align-items:center;gap:12px;margin-bottom:1.5rem;}
.hd h1{font-size:18px;font-weight:500;flex:1;color:var(--tb);}
.badge{font-size:12px;padding:3px 10px;border-radius:8px;background:var(--gold);color:#fff;}
.block{background:var(--nv7);border:1px solid var(--nv5);border-radius:12px;padding:1rem 1.25rem;margin-bottom:1rem;}
.block-title{font-size:14px;font-weight:700;color:var(--gL);letter-spacing:.08em;margin-bottom:.875rem;border-left:3px solid var(--gold);padding-left:8px;}
.field{margin-bottom:.875rem;}
.field:last-child{margin-bottom:0;}
.field-label{font-size:13px;color:var(--tm);margin-bottom:5px;display:block;}
select{width:100%;padding:8px 10px;font-size:14px;border:1px solid var(--nv5);border-radius:8px;background:var(--nv6);color:var(--tb);appearance:auto;}
input[type=number]{padding:7px 10px;font-size:14px;border:1px solid var(--nv5);border-radius:8px;background:var(--nv6);color:var(--tb);width:72px;text-align:center;}
.chip-group{display:flex;flex-wrap:wrap;gap:7px;}
.chip{font-size:13px;padding:5px 13px;border-radius:8px;border:1.5px solid var(--nv5);background:var(--nv6);color:var(--tmu);cursor:pointer;display:flex;align-items:center;gap:4px;transition:border-color .15s,color .15s;}
.chip:hover{border-color:var(--gL);color:var(--tm);}
.chip.on{border:2.5px solid var(--gold);color:var(--gL);font-weight:500;background:var(--nv8);}
.chip .ck{font-size:13px;display:none;}
.chip.on .ck{display:inline;}
.range-row{display:flex;align-items:center;gap:8px;}
.range-row span{font-size:13px;color:var(--tmu);}
.slider-wrap{display:flex;flex-direction:column;gap:8px;}
.slider-row{display:flex;align-items:center;gap:8px;}
.slider-row label{font-size:13px;color:var(--tmu);width:48px;}
.slider-row input[type=range]{flex:1;accent-color:var(--gold);}
.sval{font-size:13px;font-weight:500;color:var(--tb);min-width:34px;}
.btn-action{width:100%;padding:11px;font-size:14px;font-weight:500;border-radius:8px;cursor:pointer;border:none;display:flex;align-items:center;justify-content:center;gap:6px;margin-top:.875rem;}
.btn-action:disabled{opacity:.4;cursor:not-allowed;}
.btn-train{background:var(--gold);color:#fff;}
.btn-train:hover{background:var(--gL);}
.btn-pdf-a{background:transparent;color:var(--tm);border:1.5px solid var(--nv5)!important;}
.btn-pdf-a:hover{border-color:var(--gold)!important;color:var(--gL)!important;}
.btn-back{background:transparent;color:var(--tm);border:1.5px solid var(--nv5)!important;max-width:200px;margin:0 auto;}
.end-btn{font-size:13px;padding:5px 14px;border-radius:8px;border:1.5px solid var(--nv5);background:transparent;color:var(--tmu);cursor:pointer;}
.prog-bar{height:4px;background:var(--nv6);border-radius:2px;margin-bottom:1rem;}
.prog-fill{height:100%;background:var(--gold);border-radius:2px;transition:width .3s;}
.ctr{font-size:13px;color:var(--tmu);text-align:center;margin-bottom:1rem;}
.card{background:#fff;border:1px solid #e5e5e0;border-radius:16px;padding:3rem 2rem;text-align:center;min-height:280px;display:flex;flex-direction:column;align-items:center;justify-content:center;margin-bottom:1rem;}
.card-type{font-size:14px;color:#aaa;margin-bottom:.75rem;}
.card-q{font-size:36px;font-weight:500;line-height:1.4;color:#1a1a1a;}
.card-a{font-size:26px;color:#185FA5;font-weight:500;margin-top:1rem;padding-top:1rem;border-top:1px solid #e5e5e0;width:100%;opacity:0;visibility:hidden;transition:opacity .3s;}
.card-a.show{opacity:1;visibility:visible;}
.btn-row{display:flex;gap:10px;margin-bottom:.75rem;}
.btn-row button{flex:1;padding:9px;font-size:14px;border-radius:8px;cursor:pointer;border:1.5px solid #d0d0c8;background:#f5f5f0;color:#1a1a1a;}
.btn-blue{background:#fff!important;border-color:#378ADD!important;color:#185FA5!important;font-weight:500;}
.btn-ok{color:#0F6E56!important;border-color:#5DCAA5!important;}
.btn-ng{color:#A32D2D!important;border-color:#F09595!important;}
.timer-bar{height:4px;background:var(--nv6);border-radius:2px;margin-bottom:1rem;overflow:hidden;}
.timer-fill{height:100%;border-radius:2px;}
.p-ctrl{display:flex;gap:10px;justify-content:center;}
.end-box{text-align:center;padding:2rem;}
.end-box .big{font-size:22px;font-weight:500;margin-bottom:.5rem;color:var(--tb);}
.end-box .sub{font-size:14px;color:var(--tmu);margin-bottom:1.5rem;}
#pdf-msg{font-size:12px;color:var(--tmu);text-align:center;margin-top:6px;min-height:16px;}
.loading{text-align:center;padding:2rem;color:var(--tmu);font-size:14px;}
.error-msg{color:#F09595;font-size:13px;margin-top:6px;text-align:center;}
</style>

</head>
<body>
<!-- ログイン画面 -->
<div id="sec-login" style="position:fixed;top:0;left:0;width:100vw;height:100vh;display:flex;align-items:center;justify-content:center;background:var(--nv9);z-index:9999;">
  <div style="background:var(--nv7);border:1px solid var(--nv5);border-radius:16px;padding:2.5rem 2rem;width:320px;text-align:center;">
    <div style="font-size:22px;font-weight:700;color:var(--gL);margin-bottom:0.5rem;">KRONE Prep</div>
    <div style="font-size:12px;color:var(--tmu);margin-bottom:2rem;">β版</div>
    <input id="login-user" type="text" placeholder="ID" style="width:100%;padding:10px;margin-bottom:10px;border-radius:8px;border:1px solid var(--nv5);background:var(--nv6);color:var(--tb);font-size:14px;">
    <input id="login-pass" type="password" placeholder="パスワード" style="width:100%;padding:10px;margin-bottom:16px;border-radius:8px;border:1px solid var(--nv5);background:var(--nv6);color:var(--tb);font-size:14px;" onkeydown="if(event.key==='Enter')login()">
    <button onclick="login()" style="width:100%;padding:11px;background:var(--gold);color:#fff;border:none;border-radius:8px;font-size:15px;font-weight:600;cursor:pointer;">ログイン</button>
    <div id="login-err" style="color:#F09595;font-size:13px;margin-top:10px;min-height:18px;"></div>
  </div>
</div>
<!-- 管理画面 -->
<div id="sec-admin" style="display:none;">
<div class="wrap">
  <div class="hd"><h1>管理画面</h1><button onclick="showMain()" style="font-size:12px;padding:5px 14px;border-radius:8px;border:1px solid var(--nv5);background:transparent;color:var(--tmu);cursor:pointer;">← トレーニングへ戻る</button></div>
  <div class="block">
    <div class="block-title">ユーザー管理</div>
    <div class="field">
      <span class="field-label">新規ユーザー追加</span>
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:8px;">
        <input id="new-username" type="text" placeholder="ログインID" style="padding:8px;border-radius:8px;border:1px solid var(--nv5);background:var(--nv6);color:var(--tb);font-size:13px;">
        <input id="new-password" type="text" placeholder="パスワード" style="padding:8px;border-radius:8px;border:1px solid var(--nv5);background:var(--nv6);color:var(--tb);font-size:13px;">
        <input id="new-name" type="text" placeholder="名前" style="padding:8px;border-radius:8px;border:1px solid var(--nv5);background:var(--nv6);color:var(--tb);font-size:13px;">
        <input id="new-grade" type="text" placeholder="学年" style="padding:8px;border-radius:8px;border:1px solid var(--nv5);background:var(--nv6);color:var(--tb);font-size:13px;">
      </div>
      <button onclick="addUser()" class="btn-action btn-train" style="margin-top:0;">ユーザー追加</button>
      <div id="user-msg" style="font-size:12px;color:var(--tmu);margin-top:6px;min-height:16px;"></div>
    </div>
  </div>

  <div class="block">
    <div class="block-title">ユーザー一覧・アクセス権</div>
    <div id="user-list" style="font-size:13px;color:var(--text-mid);">読み込み中...</div>
  </div>

  <div class="block">
    <div class="block-title">利用ログ</div>
    <div style="display:flex;gap:8px;margin-bottom:8px;">
      <select id="log-user-filter" style="flex:1;padding:8px;border-radius:8px;border:1px solid var(--nv5);background:var(--nv6);color:var(--tb);font-size:13px;">
        <option value="">全ユーザー</option>
      </select>
      <select id="log-type-filter" style="padding:8px;border-radius:8px;border:1px solid var(--nv5);background:var(--nv6);color:var(--tb);font-size:13px;">
        <option value="training">トレーニング</option>
        <option value="pdf">PDF生成</option>
      </select>
    </div>
    <button onclick="loadLogs()" class="btn-action btn-train" style="margin-top:0;margin-bottom:8px;">ログを表示</button>
    <div id="log-list" style="font-size:12px;color:var(--tm);max-height:400px;overflow-y:auto;"></div>
  </div>

  <div class="block">
    <div class="block-title">学習状況</div>
    <select id="chart-user" onchange="loadChart()" style="width:100%;padding:8px;border-radius:8px;border:1px solid var(--nv5);background:var(--nv6);color:var(--tb);font-size:13px;margin-bottom:8px;">
      <option value="">ユーザーを選択</option>
    </select>
    <canvas id="log-chart" style="width:100%;background:#fff;border-radius:8px;"></canvas>
  </div>
</div>
</div>

<!-- メイン画面 -->
<div id="sec-main" style="display:none;">
<div class="wrap">

<!-- 設定画面 -->
<div class="sec on" id="sec-setup">
  <div class="hd"><h1>KRONE Prep</h1><span class="badge">β版</span><span style="font-size:11px;color:var(--tmu);margin-left:auto">v0.4</span><span id="user-name" style="font-size:12px;color:var(--gL);margin-left:8px;"></span><div id="user-stats" style="display:none;flex-direction:row;gap:10px;align-items:center;margin-left:8px;">
  <div style="text-align:center;">
    <div id="stat-streak" style="font-size:16px;font-weight:500;color:var(--gL);">🔥0</div>
    <div style="font-size:9px;color:var(--tmu);">連続日数</div>
  </div>
  <div style="width:1px;height:28px;background:var(--nv5);"></div>
  <div style="text-align:center;">
    <div id="stat-total" style="font-size:16px;font-weight:500;color:var(--gL);">0問</div>
    <div style="font-size:9px;color:var(--tmu);">累計</div>
  </div>
</div><button id="btn-admin" onclick="showAdmin()" style="display:none;font-size:11px;padding:3px 10px;border-radius:6px;border:1px solid var(--gold);background:transparent;color:var(--gL);cursor:pointer;margin-left:8px;">管理</button><button onclick="logout()" style="font-size:11px;padding:3px 10px;border-radius:6px;border:1px solid var(--nv5);background:transparent;color:var(--tmu);cursor:pointer;margin-left:8px;">ログアウト</button></div>

  <div class="block">
    <div class="block-title">共通設定</div>
    <div class="field">
      <span class="field-label">テキスト</span>
      <select id="sel-sheet" onchange="pickSheet().then(function(){var k=TEXTBOOKS[document.getElementById('sel-sheet').value];if(k){var isK=k.subject==='kanji';document.querySelector('[data-v=normal]').innerHTML='<span class=ck>✓</span>'+(isK?'書き練習（読み→漢字）':'言葉→意味');document.querySelector('[data-v=reverse]').innerHTML='<span class=ck>✓</span>'+(isK?'読み練習（漢字→読み）':'意味→言葉');}})">
        <option value="">── 読み込み中... ──</option>
      </select>
      <div class="error-msg" id="load-error" style="display:none"></div>
    </div>
    <div class="field" id="field-genre" style="display:none">
      <span class="field-label">ジャンル</span>
      <div class="chip-group" id="g-genre"></div>
    </div>
    <div class="field">
      <span class="field-label">問題番号の範囲</span>
      <div class="range-row">
        <input type="number" id="rng-from" value="1" min="1">
        <span>〜</span>
        <input type="number" id="rng-to" value="30" min="1">
        <span id="rng-hint" style="font-size:12px;color:#aaa"></span>
      </div>
    </div>
  </div>

  <div class="block">
    <div class="block-title">トレーニング設定</div>
    <div class="field">
      <span class="field-label">出題方向</span>
      <div class="chip-group" id="g-dir">
        <button class="chip on" data-v="normal" onclick="pickChip('g-dir',this)"><span class="ck">✓</span>言葉→意味</button>
        <button class="chip" data-v="reverse" onclick="pickChip('g-dir',this)"><span class="ck">✓</span>意味→言葉</button>
        <button class="chip" data-v="both" onclick="pickChip('g-dir',this)"><span class="ck">✓</span>ミックス</button>
      </div>
    </div>
    <div class="field">
      <span class="field-label">出題数</span>
      <div class="chip-group" id="g-count">
        <button class="chip on" data-v="10" onclick="pickChip('g-count',this)"><span class="ck">✓</span>10問</button>
        <button class="chip" data-v="20" onclick="pickChip('g-count',this)"><span class="ck">✓</span>20問</button>
        <button class="chip" data-v="30" onclick="pickChip('g-count',this)"><span class="ck">✓</span>30問</button>
        <button class="chip" data-v="50" onclick="pickChip('g-count',this)"><span class="ck">✓</span>50問</button>
      </div>
    </div>
    <div class="field">
      <span class="field-label">モード</span>
      <div class="chip-group" id="g-mode">
        <button class="chip on" data-v="active" onclick="pickMode(this)"><span class="ck">✓</span>チェックモード</button>
        <button class="chip" data-v="passive" onclick="pickMode(this)"><span class="ck">✓</span>オートモード</button>
      </div>
    </div>
    <div id="field-timer" style="display:none;margin-top:.75rem">
      <span class="field-label">オートモードの表示時間</span>
      <div class="slider-wrap">
        <div class="slider-row">
          <label>問題</label>
          <input type="range" min="1" max="10" step="1" value="3" id="sl-q" oninput="document.getElementById('sv-q').textContent=this.value+'秒'">
          <span class="sval" id="sv-q">3秒</span>
        </div>
        <div class="slider-row">
          <label>答え</label>
          <input type="range" min="1" max="10" step="1" value="4" id="sl-a" oninput="document.getElementById('sv-a').textContent=this.value+'秒'">
          <span class="sval" id="sv-a">4秒</span>
        </div>
      </div>
    </div>
    <button class="btn-action btn-train" id="btn-start" onclick="startTraining()" disabled>
      ▶ トレーニング開始
    </button>
  </div>

  <div class="block">
    <div class="block-title">PDF設定</div>
    <div class="field">
      <span class="field-label">出題数</span>
      <div class="chip-group" id="g-pdf-count">
        <button class="chip on" data-v="20" onclick="pickChip('g-pdf-count',this)"><span class="ck">✓</span>20問</button>
        <button class="chip" data-v="40" onclick="pickChip('g-pdf-count',this)"><span class="ck">✓</span>40問</button>
        <button class="chip" data-v="60" onclick="pickChip('g-pdf-count',this)"><span class="ck">✓</span>60問</button>
      </div>
    </div>
    <div class="field" id="field-latex-mode" style="display:none">
      <span class="field-label">問題モード（国語）</span>
      <div class="chip-group" id="g-latex-mode">
        <button class="chip on" data-v="1" onclick="pickChip('g-latex-mode',this)"><span class="ck">✓</span>書き練習</button>
        <button class="chip" data-v="2" onclick="pickChip('g-latex-mode',this)"><span class="ck">✓</span>読み練習</button>
        <button class="chip" data-v="3" onclick="pickChip('g-latex-mode',this)"><span class="ck">✓</span>ランダム</button>
      </div>
    </div>
    <div class="field" id="field-kanji-mode" style="display:none">
      <span class="field-label">問題モード（漢字）</span>
      <div class="chip-group" id="g-kanji-mode">
        <button class="chip on" data-v="yomi" onclick="pickChip('g-kanji-mode',this)"><span class="ck">✓</span>読み練習（漢字→読み）</button>
        <button class="chip" data-v="kaki" onclick="pickChip('g-kanji-mode',this)"><span class="ck">✓</span>書き練習（読み→漢字）</button>
        <button class="chip" data-v="random" onclick="pickChip('g-kanji-mode',this)"><span class="ck">✓</span>ランダム</button>
      </div>
    </div>
    <div class="field" id="field-eigo-mode" style="display:none">
      <span class="field-label">問題モード（英語）</span>
      <div class="chip-group" id="g-eigo-mode">
        <button class="chip on" data-v="ej" onclick="pickChip('g-eigo-mode',this)"><span class="ck">✓</span>英語→日本語</button>
        <button class="chip" data-v="je" onclick="pickChip('g-eigo-mode',this)"><span class="ck">✓</span>日本語→英語</button>
        <button class="chip" data-v="random" onclick="pickChip('g-eigo-mode',this)"><span class="ck">✓</span>ランダム</button>
      </div>
    </div>
    <button class="btn-action btn-pdf-a" id="btn-pdf" onclick="makePDF()" disabled>
      📄 PDFを作る
    </button>
    <div id="pdf-msg"></div>
  </div>
</div>

<!-- チェックモード -->
<div class="sec" id="sec-active">
  <div class="hd"><h1 id="a-title">トレーニング</h1><button class="end-btn" onclick="goSetup()">終了</button></div>
  <div class="prog-bar"><div class="prog-fill" id="a-prog" style="width:0%"></div></div>
  <div class="ctr" id="a-ctr"></div>
  <div class="card">
    <div class="card-type" id="a-type"></div>
    <div class="card-q" id="a-q"></div>
    <div class="card-a" id="a-ans"></div>
    <div id="a-pron" style="font-size:14px;color:#888;margin-top:6px;opacity:0;visibility:hidden;transition:opacity .3s;min-height:20px;"></div>
  </div>
  <div class="btn-row"><button class="btn-blue" id="btn-reveal" onclick="revealAnswer()">答えを見る</button></div>
  <div class="btn-row" id="judge-row" style="display:none">
    <button class="btn-ng" onclick="judge(false)">✕ もう一度</button>
    <button class="btn-ok" onclick="judge(true)">○ 正解</button>
  </div>
</div>

<!-- オートモード -->
<div class="sec" id="sec-passive">
  <div class="hd"><h1>オートモード</h1><button class="end-btn" onclick="goSetup()">終了</button></div>
  <div class="timer-bar"><div class="timer-fill" id="p-timer" style="background:#378ADD;width:100%"></div></div>
  <div class="ctr" id="p-ctr"></div>
  <div class="card">
    <div class="card-type" id="p-type"></div>
    <div class="card-q" id="p-q"></div>
    <div class="card-a" id="p-ans"></div>
  </div>
  <div class="p-ctrl">
    <button class="chip" id="btn-pause" onclick="togglePause()">⏸ 一時停止</button>
    <button class="chip" onclick="skipPassive()">→ 次へ</button>
  </div>
</div>

<!-- 完了画面 -->
<div class="sec" id="sec-end">
  <div class="end-box">
    <div class="big">お疲れさまでした！</div>
    <div id="result-card" style="background:var(--nv7);border:1px solid var(--gold);border-radius:16px;padding:20px;margin:12px 0;text-align:center;display:none;">
      <div id="result-rate" style="font-size:48px;font-weight:500;color:var(--gL);line-height:1.1;">--</div>
      <div style="font-size:13px;color:var(--tm);margin-bottom:16px;">正答率</div>
      <div id="result-detail" style="font-size:13px;color:var(--tb);margin-bottom:16px;"></div>
      <div style="display:flex;gap:8px;justify-content:center;">
        <div style="background:var(--nv8);border-radius:8px;padding:8px 16px;text-align:center;">
          <div id="result-streak" style="font-size:18px;font-weight:500;color:var(--gL);">🔥--</div>
          <div style="font-size:10px;color:var(--tmu);">連続学習</div>
        </div>
        <div style="background:var(--nv8);border-radius:8px;padding:8px 16px;text-align:center;">
          <div id="result-total" style="font-size:18px;font-weight:500;color:var(--gL);">--問</div>
          <div style="font-size:10px;color:var(--tmu);">累計達成</div>
        </div>
      </div>
    </div>
    <div id="badge-area" style="margin:12px 0;display:none;">
      <div style="font-size:12px;color:var(--tmu);margin-bottom:8px;">獲得バッジ</div>
      <div id="badge-list" style="display:flex;flex-wrap:wrap;gap:8px;justify-content:center;"></div>
    </div>
    <div class="sub" id="end-msg"></div>
    <button class="btn-action btn-back" onclick="goSetup()">← 設定に戻る</button>
  </div>
</div>

</div>
<script>
// ============================================================
// 設定（ここだけ変更すればOK）
// ============================================================
const SHEET_ID = '1eKa9ATYPEp8DV-10L96PkOuHfQsTXlIuxSS8KGZ9PaY';
const MANAGE_SHEET = '管理';

// ============================================================
// データ
// ============================================================
let TEXTBOOKS = {};   // { key: {label, sheetName, subject, ansWidth, genres, items} }
let curSheet = null, curGenres = [], queue = [], idx = 0;
let paused = false, rafId = null, phaseStart = 0, phase = 'q';

// ============================================================
// CSV取得・パース
// ============================================================
function csvUrl(sheetName){
  return `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:csv&sheet=${encodeURIComponent(sheetName)}`;
}

function parseCSV(text){
  const rows = [];
  const lines = text.split('\n');
  for(const line of lines){
    if(!line.trim()) continue;
    const cols = [];
    let inQ = false, cur = '';
    for(let i=0;i<line.length;i++){
      const c = line[i];
      if(c==='"'){ inQ=!inQ; continue; }
      if(c===','&&!inQ){ cols.push(cur.trim()); cur=''; continue; }
      cur+=c;
    }
    cols.push(cur.trim());
    rows.push(cols);
  }
  return rows;
}

// ============================================================
// 起動時：管理シートを読んでテキスト一覧を生成
// ============================================================
window.loadManageSheet = async function loadManageSheet(){
  try{
    const res = await fetch(csvUrl(MANAGE_SHEET));
    if(!res.ok) throw new Error('管理シートの読み込みに失敗しました');
    const text = await res.text();
    const rows = parseCSV(text);
    // 1行目はヘッダー（テキスト名, シート名, 科目, 答え欄）
    const sel = document.getElementById('sel-sheet');
    sel.innerHTML = '<option value="">── テキストを選ぶ ──</option>';
    TEXTBOOKS = {};
    for(let i=1;i<rows.length;i++){
      const [label, sheetName, subject, ansWidth] = rows[i];
      if(!label||!sheetName) continue;
      const key = 'tb_'+i;
      // アクセス権チェック（教師は全テキスト、生徒はaccessKeysに含まれるものだけ）
      if(currentUser && currentUser.role !== 'teacher' && currentUser.accessKeys && !currentUser.accessKeys.includes(key)) continue;
      TEXTBOOKS[key] = {
        label: label.trim(),
        sheetName: sheetName.trim(),
        subject: (subject||'kokugo').trim(),
        ansWidth: (ansWidth||'medium').trim(),
        genres: null,
        items: null
      };
      const opt = document.createElement('option');
      opt.value = key;
      opt.textContent = label.trim();
      sel.appendChild(opt);
    }
  } catch(e){
    document.getElementById('load-error').style.display='';
    document.getElementById('load-error').textContent = 'テキスト一覧の読み込みに失敗しました。スプレッドシートの共有設定を確認してください。';
    const sel = document.getElementById('sel-sheet');
    sel.innerHTML = '<option value="">── 読み込み失敗 ──</option>';
  }
}

// ============================================================
// テキスト選択時：該当シートを読み込む
// ============================================================
async function pickSheet(){
  const sel = document.getElementById('sel-sheet');
  curSheet = sel.value || null;
  const gf = document.getElementById('field-genre');
  const gg = document.getElementById('g-genre');
  gg.innerHTML=''; curGenres=[];
  document.getElementById('btn-start').disabled=true;
  document.getElementById('btn-pdf').disabled=true;
  document.getElementById('rng-hint').textContent='';
  gf.style.display='none';

  if(!curSheet) return;

  const tb = TEXTBOOKS[curSheet];
  document.getElementById('rng-hint').textContent='読み込み中...';

  try{
    const res = await fetch(csvUrl(tb.sheetName));
    if(!res.ok) throw new Error('シートの読み込みに失敗');
    const text = await res.text();
    const rows = parseCSV(text);

    // 2行目以降がデータ（1行目はヘッダー）
    const isEigo = tb.subject === 'eigo';
    const items = [];
    const genreSet = new Set();

    for(let i=1;i<rows.length;i++){
      const r = rows[i];
      if(!r[0]) continue;
      const no = parseInt(r[0])||i;
      if(isEigo){
        // A:番号 B:学年 C:テキスト D:英単語 E:意味
        items.push({ no, word: (r[3]||'').trim(), meaning: (r[4]||'').trim(), pronunciation: (r[5]||'').trim(), genre: '英→日' });
      } else {
        // A:番号 B:学年 C:テキスト D:種別 E:言葉 F:意味
        const genre = (r[3]||'').trim();
        items.push({ no, word: (r[4]||'').trim(), meaning: (r[5]||'').trim(), genre });
        if(genre) genreSet.add(genre);
      }
    }

    tb.items = items;

    // ジャンル（国語のみ・2種類以上あれば表示）
    if(!isEigo && genreSet.size > 1){
      tb.genres = [...genreSet];
      gf.style.display='';
      tb.genres.forEach(g=>{
        const b = document.createElement('button');
        b.className='chip on'; b.dataset.v=g;
        b.innerHTML='<span class="ck">✓</span>'+g;
        b.onclick=()=>toggleGenre(b,g);
        gg.appendChild(b);
        curGenres.push(g);
      });
    } else {
      tb.genres = null;
    }

    document.getElementById('rng-to').value = items.length;
    document.getElementById('rng-hint').textContent = '（全'+items.length+'問）';
    document.getElementById('btn-start').disabled=false;
    document.getElementById('btn-pdf').disabled=false;
    document.getElementById('field-kanji-mode').style.display = tb.subject === 'kanji' ? '' : 'none';
    document.getElementById('field-latex-mode').style.display = tb.subject === 'kokugo' ? '' : 'none';
    document.getElementById('field-eigo-mode').style.display = tb.subject === 'eigo' ? '' : 'none';

  } catch(e){
    document.getElementById('rng-hint').textContent='読み込みに失敗しました';
  }
}

function toggleGenre(el, g){
  el.classList.toggle('on');
  if(el.classList.contains('on')) curGenres.push(g);
  else curGenres = curGenres.filter(x=>x!==g);
}

// ============================================================
// UI共通
// ============================================================
function showSec(id){
  document.querySelectorAll('.sec').forEach(s=>s.classList.remove('on'));
  document.getElementById(id).classList.add('on');
}
function goSetup(){
  stopPassive();
  showSec('sec-setup');
  const card = document.getElementById('result-card');
  if(card) card.style.display = 'none';
  const area = document.getElementById('badge-area');
  if(area) area.style.display = 'none';
}

function pickChip(gid, el){
  document.querySelectorAll('#'+gid+' .chip').forEach(b=>b.classList.remove('on'));
  el.classList.add('on');
}
function pickMode(el){
  pickChip('g-mode', el);
  document.getElementById('field-timer').style.display = el.dataset.v==='passive' ? '' : 'none';
}
function getVal(gid){
  const a = document.querySelector('#'+gid+' .chip.on');
  return a ? a.dataset.v : null;
}
function shuffle(a){
  for(let i=a.length-1;i>0;i--){
    const j=Math.floor(Math.random()*(i+1));
    [a[i],a[j]]=[a[j],a[i]];
  }
  return a;
}

// ============================================================
// キュー構築
// ============================================================
function buildQueue(countGroup){
  const tb = TEXTBOOKS[curSheet];
  const from = parseInt(document.getElementById('rng-from').value)||1;
  const to   = parseInt(document.getElementById('rng-to').value)||tb.items.length;
  const dir  = getVal('g-dir')||'normal';
  let base = tb.items.filter(d=>d.no>=from && d.no<=to);
  if(tb.genres && curGenres.length>0)
    base = base.filter(d=>curGenres.includes(d.genre));
  let items=[];
  if(dir==='normal'||dir==='both') base.forEach(d=>items.push({q:d.word, a:d.meaning, pronunciation:d.pronunciation||'', type:d.genre}));
  if(dir==='reverse'||dir==='both') base.forEach(d=>items.push({q:d.meaning, a:d.word, pronunciation:d.pronunciation||'', type:d.genre+'（逆）'}));
  shuffle(items);
  const n = getVal(countGroup)||'10';
  return n==='all' ? items : items.slice(0, parseInt(n));
}

// PDF用：国語は常に word=語句（上段）・meaning=意味（下段）で固定
function buildQueueForPDF(countGroup){
  const tb = TEXTBOOKS[curSheet];
  const from = parseInt(document.getElementById('rng-from').value)||1;
  const to   = parseInt(document.getElementById('rng-to').value)||tb.items.length;
  const dir  = getVal('g-dir')||'normal';
  let base = tb.items.filter(d=>d.no>=from && d.no<=to);
  if(tb.genres && curGenres.length>0)
    base = base.filter(d=>curGenres.includes(d.genre));
  let items=[];
  const isEigo = tb.subject === 'eigo';
  if(isEigo){
    if(dir==='normal'||dir==='both') base.forEach(d=>items.push({q:d.word, a:d.meaning, type:d.genre}));
    if(dir==='reverse'||dir==='both') base.forEach(d=>items.push({q:d.meaning, a:d.word, type:d.genre+'（逆）'}));
  } else if(tb.subject === 'kanji'){
    base.forEach(d=>items.push({word:d.word, meaning:d.meaning, type:d.genre}));
  } else {
    // 国語：語句=上段・意味=下段固定。dirを保持して問題ページの空欄を制御
    if(dir==='normal'||dir==='both') base.forEach(d=>items.push({q:d.word, a:d.meaning, type:d.genre, dir:'normal'}));
    if(dir==='reverse'||dir==='both') base.forEach(d=>items.push({q:d.word, a:d.meaning, type:d.genre, dir:'reverse'}));
  }
  shuffle(items);
  const n = getVal(countGroup)||'30';
  return n==='all' ? items : items.slice(0, parseInt(n));
}

// ============================================================
// チェックモード
// ============================================================
function startTraining(){
  if(!curSheet) return;
  queue=buildQueue('g-count'); idx=0;
  sessionCorrect=0; sessionTotal=0;
  logTraining(queue.length);
  const initPron=document.getElementById('a-pron');if(initPron){initPron.textContent='';initPron.style.opacity='0';}
  const mode = getVal('g-mode')||'active';
  if(mode==='active'){ showSec('sec-active'); renderActive(); }
  else { showSec('sec-passive'); startPassive(); }
}
function renderActive(){
  if(idx>=queue.length){
    showSec('sec-end');
    const rate = sessionTotal > 0 ? Math.round(sessionCorrect/sessionTotal*100) : 0;
    document.getElementById('end-msg').textContent = '';
    // 結果カード表示
    // ストリーク・累計更新後に表示
    await loadUserStats();
    const streak = window._userStreak || 0;
    const cumTotal = window._userTotal || 0;
    // 結果カード表示
    showResultCard(rate, sessionCorrect, sessionTotal, streak, cumTotal);
    // バッジチェック
    showBadges(cumTotal, streak);
    // 正答率をログに記録
    logTrainingResult(sessionCorrect, sessionTotal);
    return;
  }
  const item=queue[idx], tot=queue.length;
  document.getElementById('a-prog').style.width=(idx/tot*100)+'%';
  document.getElementById('a-ctr').textContent=(idx+1)+' / '+tot;
  document.getElementById('a-type').textContent=item.type;
  document.getElementById('a-q').textContent=item.q;
  document.getElementById('a-ans').textContent=item.a;
  document.getElementById('a-ans').classList.remove('show');
  const pronEl=document.getElementById('a-pron');if(pronEl){pronEl.textContent=item.pronunciation||'';pronEl.style.opacity='0';pronEl.style.visibility='hidden';}
  const aPron = document.getElementById('a-pron'); if(aPron) aPron.style.opacity='0';
  document.getElementById('btn-reveal').style.display='';
  document.getElementById('judge-row').style.display='none';
}
function revealAnswer(){
  document.getElementById('a-ans').classList.add('show');
  const pron = document.getElementById('a-pron'); if(pron){pron.style.visibility='visible';pron.style.opacity='1';}
  document.getElementById('btn-reveal').style.display='none';
  document.getElementById('judge-row').style.display='flex';
}
function judge(isCorrect){
  sessionTotal++;
  if(isCorrect) sessionCorrect++;
  idx++;
  renderActive();
}

// ============================================================
// オートモード
// ============================================================
function getQms(){ return parseInt(document.getElementById('sl-q').value)*1000; }
function getAms(){ return parseInt(document.getElementById('sl-a').value)*1000; }

function startPassive(){
  paused=false; phase='q'; phaseStart=performance.now();
  renderPassiveCard();
  cancelAnimationFrame(rafId);
  rafId=requestAnimationFrame(tickPassive);
}
function renderPassiveCard(){
  if(idx>=queue.length){
    stopPassive(); showSec('sec-end');
    document.getElementById('end-msg').textContent=queue.length+'問 完了（オートモード）';
    return;
  }
  const item=queue[idx];
  document.getElementById('p-type').textContent=item.type;
  document.getElementById('p-q').textContent=item.q;
  document.getElementById('p-ans').textContent=item.a;
  document.getElementById('p-ans').classList.remove('show');
  document.getElementById('p-ctr').textContent=(idx+1)+' / '+queue.length;
  document.getElementById('p-timer').style.background='#378ADD';
  document.getElementById('p-timer').style.width='100%';
}
function tickPassive(now){
  if(paused){ rafId=requestAnimationFrame(tickPassive); return; }
  const dur = phase==='q' ? getQms() : getAms();
  const pct = Math.max(0, 1-(now-phaseStart)/dur);
  document.getElementById('p-timer').style.width=(pct*100)+'%';
  if(now-phaseStart>=dur){
    if(phase==='q'){
      phase='a'; phaseStart=now;
      document.getElementById('p-ans').classList.add('show');
      document.getElementById('p-timer').style.background='#1D9E75';
      document.getElementById('p-timer').style.width='100%';
    } else {
      idx++; phase='q'; phaseStart=now; renderPassiveCard();
    }
  }
  rafId=requestAnimationFrame(tickPassive);
}
function skipPassive(){
  cancelAnimationFrame(rafId);
  idx++; phase='q'; phaseStart=performance.now();
  renderPassiveCard();
  rafId=requestAnimationFrame(tickPassive);
}
function stopPassive(){ cancelAnimationFrame(rafId); rafId=null; }
function togglePause(){
  paused=!paused;
  const btn=document.getElementById('btn-pause');
  if(paused){
    btn.classList.add('on');
    btn.textContent='▶ 再開';
  } else {
    btn.classList.remove('on');
    btn.textContent='⏸ 一時停止';
    phaseStart=performance.now()-(phase==='q'?getQms():getAms())*(1-parseFloat(document.getElementById('p-timer').style.width)/100);
  }
}

// ============================================================
// PDF生成
// ============================================================
function makePDF(){
  if(!curSheet) return;
  const msg = document.getElementById('pdf-msg');
  msg.textContent = '新しいタブを開いています...';
  const qs = buildQueueForPDF('g-pdf-count');
  const tb = TEXTBOOKS[curSheet];
  const sheetLabel = tb.label;
  const ansWidth = tb.ansWidth;
  const isEigo = tb.subject === 'eigo';
  const dir = getVal('g-dir')||'normal';
  const dirLabel = {normal:'言葉→意味', reverse:'意味→言葉', both:'両方向'}[dir]||'';
  const from = document.getElementById('rng-from').value;
  const to   = document.getElementById('rng-to').value;
  const subtitle = sheetLabel+'　No.'+from+'〜'+to+'　'+dirLabel+'　'+qs.length+'問';

  let html = '';

  if(isEigo){
    // ==============================
    // 英語：横書きレイアウト（2列・40問/ページ）
    // ==============================
    const E_PER_PAGE = 40;
    const ansH = '9mm';

    // 左列(1〜20)・右列(21〜40)を横並びにして1ページ40問
    const HALF = 20;

    function makeEigoCell(item, n, isAnswer, mode){
      // ej: 英語表示・日本語空欄  je: 日本語表示・英語空欄  random: ランダム  answer: 両方
      const rand = Math.random() < 0.5;
      let showQ, showA;
      if(isAnswer){ showQ=true; showA=true; }
      else if(mode==='ej'){ showQ=true; showA=false; }
      else if(mode==='je'){ showQ=false; showA=true; }
      else if(mode==='random'){ showQ=rand; showA=!rand; }
      else { showQ=true; showA=false; }
      const qContent = showQ ? `<span class="wbold">${item.q}</span>` : `<span class="ans-line-w"></span>`;
      const aContent = showA ? `<span class="atxt">${item.a}</span>` : `<span class="ans-line"></span>`;
      return `<div class="erow">
  <span class="ncell">Q${n}</span>
  <span class="wcell">${qContent}</span>
  <span class="acell">${aContent}</span>
</div>`;
    }

    const eigoMode = getVal('g-eigo-mode')||'ej';
    function makeEigoPage(chunk, offset, isAnswer, labelSuffix){
      const left  = chunk.slice(0, HALF);
      const right = chunk.slice(HALF);
      let rows = '';
      for(let i=0; i<HALF; i++){
        const l = left[i];
        const r = right[i];
        const lCell = l ? makeEigoCell(l, offset+i+1, isAnswer, eigoMode) : '<div class="erow empty"></div>';
        const rCell = r ? makeEigoCell(r, offset+HALF+i+1, isAnswer, eigoMode) : '<div class="erow empty"></div>';
        rows += `<div class="eline">${lCell}<div class="col-sep"></div>${rCell}</div>`;
      }
      return `<div class="epage">
  <h1>${sheetLabel}　${labelSuffix}</h1>
  <div class="sub">${subtitle}</div>
  <div class="etable">${rows}</div>
</div>`;
    }

    let pages = '';
    // 問題ページ
    for(let p=0; p<qs.length; p+=E_PER_PAGE){
      const chunk = qs.slice(p, p+E_PER_PAGE);
      pages += `<div class="eblock${p>0?' page-break':''}">${makeEigoPage(chunk, p, false, '問題')}</div>`;
    }
    // 解答ページ
    for(let p=0; p<qs.length; p+=E_PER_PAGE){
      const chunk = qs.slice(p, p+E_PER_PAGE);
      pages += `<div class="eblock page-break">${makeEigoPage(chunk, p, true, '解答')}</div>`;
    }

    html=`<!DOCTYPE html><html lang="ja"><head><meta charset="UTF-8"><title>${sheetLabel}テスト</title>
<style>
@page{size:A4;margin:0;}
@media print{.no-print{display:none!important;}body{margin:0;padding:10mm;}.page-break{page-break-before:always;padding-top:10mm;}}
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:'Hiragino Sans','Meiryo',sans-serif;color:#000;padding:10mm;}
.no-print{text-align:center;padding:6px;background:#eef3f8;border-bottom:1px solid #ccd;margin-bottom:2mm;}
.no-print button{padding:4px 14px;font-size:9pt;cursor:pointer;margin:0 4px;border-radius:5px;border:1px solid #aaa;}
.pbtn{background:#185FA5;color:#fff;border-color:#185FA5!important;}
h1{font-size:11pt;font-weight:bold;text-align:center;margin:5mm 0 0.5mm;border-bottom:0.5pt solid #000;padding-bottom:0.5mm;}
.sub{font-size:7pt;color:#555;text-align:center;margin-bottom:0.5mm;}
.etable{width:100%;}
.eline{display:flex;align-items:center;height:12.5mm;border-bottom:0.3pt solid #e8e8e8;}
.col-sep{width:4mm;flex-shrink:0;border-left:0.5pt solid #bbb;height:100%;}
.erow{display:flex;align-items:center;flex:1;height:100%;overflow:hidden;}
.erow.empty{flex:1;}
.ncell{font-size:7pt;color:#888;width:9mm;flex-shrink:0;white-space:nowrap;padding-left:1mm;}
.wcell{font-size:10pt;font-weight:bold;width:55mm;flex-shrink:0;padding:0 2mm;white-space:nowrap;overflow:hidden;}.wbold{font-size:10pt;font-weight:bold;}.ans-line-w{display:block;width:90%;border-bottom:0.5pt solid #999;height:3.5mm;}
.acell{flex:1;display:flex;align-items:center;padding:0 1mm;}
.ans-line{flex:1;border-bottom:0.5pt solid #999;height:3.5mm;}

</style>
</head><body>
<div class="no-print">
  <button class="pbtn" onclick="window.print()">印刷する / PDFで保存</button>
  <button onclick="window.close()">閉じる</button>
</div>
${pages}
</body></html>`;


  } else if(tb.subject === 'kanji'){
    const kanjiMode = getVal('g-kanji-mode')||'yomi';
    const PER_HALF = 10;
    const PER_PAGE = 20;
    const sheetLabelK = tb.label;
    const fromK = document.getElementById('rng-from').value;
    const toK = document.getElementById('rng-to').value;
    const subtitleK = sheetLabelK+' No.'+fromK+'~'+toK+' '+qs.length+'問';
    function makeKanjiBlock(item,n,mode){
      const rand=Math.random()<0.5;
      let sk,sy;
      if(mode==='answer'){sk=true;sy=true;}
      else if(mode==='yomi'){sk=true;sy=false;}
      else if(mode==='kaki'){sk=false;sy=true;}
      else{sk=rand;sy=!rand;}
      const kc=sk?'<span class="kvword">'+item.word+'</span>':'';
      const yc=sy?'<span class="kvmean">'+item.meaning+'</span>':'';
      return '<div class="kmblock"><div class="kmno">'+n+'</div><div class="kmtop">'+yc+'</div><div class="kmsep"></div><div class="kmbot">'+kc+'</div></div>';
    }
    function makeKanjiPages(items,mode,isSuffix){
      let pages='';
      for(let p=0;p<items.length;p+=PER_PAGE){
        const chunk=items.slice(p,p+PER_PAGE);
        const tB=chunk.slice(0,PER_HALF).map((item,i)=>makeKanjiBlock(item,p+i+1,mode)).join('');
        const bB=chunk.slice(PER_HALF).map((item,i)=>makeKanjiBlock(item,p+PER_HALF+i+1,mode)).join('');
        pages+='<div class="kpage'+(p>0||isSuffix?' kpage-break':'')+'"><div class="kmain"><div class="ksection"><div class="kmrow">'+tB+'</div><div class="ksep-h"></div><div class="kmrow">'+bB+'</div></div><div class="ktitle"><div class="ktitle-main">'+sheetLabelK+'</div><div class="ktitle-sub">'+subtitleK+'</div></div></div></div>';
      }
      return pages;
    }

async function loadChart() {
  const userId = document.getElementById('chart-user').value;
  if(!userId) return;
  
  const logs = await sbFetch('training_logs?user_id=eq.'+userId+'&order=created_at.asc&select=textbook_name,count,created_at');
  if(!logs||!logs.length) return;
  
  // 日別集計
  const daily = {};
  logs.forEach(log => {
    const date = log.created_at.split('T')[0];
    daily[date] = (daily[date]||0) + log.count;
  });
  
  const labels = Object.keys(daily).slice(-14); // 直近14日
  const data   = labels.map(d => daily[d]);
  
  const canvas = document.getElementById('log-chart');
  const ctx = canvas.getContext('2d');
  canvas.width  = canvas.offsetWidth || 600;
  canvas.height = 200;
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  
  if(!labels.length) return;
  
  const max = Math.max(...data, 1);
  const W = canvas.width, H = canvas.height;
  const barW = (W - 60) / labels.length;
  
  ctx.fillStyle = '#1A3260';
  ctx.fillRect(0, 0, W, H);
  
  labels.forEach((label, i) => {
    const barH = (data[i] / max) * (H - 40);
    const x = 40 + i * barW + barW * 0.1;
    const y = H - 20 - barH;
    
    ctx.fillStyle = '#BA7517';
    ctx.fillRect(x, y, barW * 0.8, barH);
    
    ctx.fillStyle = '#7A9CC0';
    ctx.font = '9px sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText(label.slice(5), x + barW*0.4, H - 5);
    
    if(data[i] > 0) {
      ctx.fillStyle = '#EAF1FA';
      ctx.fillText(data[i], x + barW*0.4, y - 3);
    }
  });
  
  // Y軸ラベル
  ctx.fillStyle = '#7A9CC0';
  ctx.font = '10px sans-serif';
  ctx.textAlign = 'right';
  ctx.fillText(max, 35, 15);
  ctx.fillText(0, 35, H - 20);
}

    {text:'勝って兜の緒を締めよ。', author:'徳川家康'},
  ]
};

function getResultConfig(rate) {
  if(rate === 100) return {
    tier: 'perfect',
    label: '🏆 パーフェクト！',
    color: '#EF9F27',
    border: '2px solid #EF9F27',
    comment: '完璧！この調子で次のテキストも制覇しよう！',
    quoteKey: 'perfect'
  };
  if(rate >= 80) return {
    tier: 'mid',
    label: '素晴らしい！',
    color: '#EF9F27',
    border: '1px solid #BA7517',
    comment: 'あと一歩で完璧！100%を狙おう！',
    quoteKey: 'mid'
  };
  return {
    tier: 'low',
    label: 'もう一歩！',
    color: '#85B7EB',
    border: '1px solid #3A5E9A',
    comment: 'もう一度挑戦して、80%を目指そう！',
    quoteKey: 'low'
  };
}

function showResultCard(rate, correct, total, streak, cumTotal) {
  const cfg = getResultConfig(rate);
  const quotes = QUOTES[cfg.quoteKey];
  const q = quotes[Math.floor(Math.random() * quotes.length)];

  const card = document.getElementById('result-card');
  card.style.display = 'block';
  card.style.border = cfg.border;
  card.innerHTML =

    '<div style="font-size:56px;font-weight:500;color:'+cfg.color+';line-height:1.0;">'+rate+'%</div>' +
    '<div style="font-size:16px;color:#B0C4DE;margin-bottom:14px;">'+correct+' / '+total+'問正解</div>' +
    '<div style="background:#1A3260;padding:12px;margin-bottom:14px;border-left:3px solid '+cfg.color+';">' +
      '<div style="font-size:11px;color:#7A9CC0;margin-bottom:4px;">— '+q.author+'</div>' +
      '<div style="font-size:13px;color:#EAF1FA;line-height:1.6;text-align:left;">'+q.text+'</div>' +
    '</div>' +
    '<div style="font-size:14px;color:'+cfg.color+';margin-bottom:14px;">'+cfg.comment+'</div>' +
    '<div style="display:flex;gap:8px;justify-content:center;">' +
      '<div style="background:#0C1B33;border-radius:8px;padding:8px 14px;text-align:center;flex:1;">' +
        '<div style="font-size:16px;font-weight:500;color:#EF9F27;">🔥'+streak+'日</div>' +
        '<div style="font-size:10px;color:#7A9CC0;">連続学習</div>' +
      '</div>' +
      '<div style="background:#0C1B33;border-radius:8px;padding:8px 14px;text-align:center;flex:1;">' +

function showBadges(total, streak) {
  const earned = BADGES.filter(b => b.check(total, streak));
  if(!earned.length) return;
  const area = document.getElementById('badge-area');
  const list = document.getElementById('badge-list');
  area.style.display = 'block';
  list.innerHTML = earned.map(b => 
    '<div style="background:var(--nv8);border:1px solid var(--gold);border-radius:8px;padding:6px 10px;text-align:center;">' +
    '<div style="font-size:20px;">'+b.icon+'</div>' +
    '<div style="font-size:10px;color:var(--gL);font-weight:500;">'+b.label+'</div>' +
    '</div>'
  ).join('');
}

async function loadUserStats() {
  if(!currentUser) return;
  try {
    const logs = await sbFetch('training_logs?user_id=eq.'+currentUser.id+'&select=count,created_at');
    const total = logs ? logs.reduce((s,l) => s+(l.count||0), 0) : 0;
    
    // ストリーク計算
    const dates = logs ? [...new Set(logs.map(l => l.created_at.split('T')[0]))].sort().reverse() : [];
    let streak = 0;
    const today = new Date().toISOString().split('T')[0];
    let check = today;
    for(const d of dates) {
      if(d === check) {
        streak++;
        const dt = new Date(check);
        dt.setDate(dt.getDate()-1);
        check = dt.toISOString().split('T')[0];
      } else break;
    }
    
    // ヘッダー更新
    const el = document.getElementById('user-stats');
    el.style.display = 'flex';
    document.getElementById('stat-streak').textContent = '🔥'+streak;
    document.getElementById('stat-total').textContent = total+'問';
    
    // グローバルに保存
    window._userStreak = streak;
    window._userTotal = total;
  } catch(e) { console.log('stats error', e); }
}

async function logTrainingResult(correct, total) {
  if(!currentUser || !curSheet) return;
  // 最新のtraining_logを更新
  try {
    const logs = await sbFetch('training_logs?user_id=eq.'+currentUser.id+'&order=created_at.desc&limit=1&select=id');
    if(logs && logs[0]) {
      await sbFetch('training_logs?id=eq.'+logs[0].id, {
        method: 'PATCH',
        headers: {'Prefer': 'return=minimal'},
        body: JSON.stringify({correct, total})
      });
    }
  } catch(e) { console.log('result log error', e); }
}

async function logTraining(count) {
  if(!currentUser) return;
  const tb = TEXTBOOKS[curSheet];
  if(!tb) return;
  try {
    await sbFetch('training_logs', {
      method: 'POST',
      headers: {'Prefer': 'return=minimal'},
      body: JSON.stringify({
        user_id: currentUser.id,
        textbook_key: curSheet,
        textbook_name: tb.label,
        subject: tb.subject,
        direction: getVal('g-dir')||'normal',
        count: count,
        mode: getVal('g-mode')||'active'
      })
    });
  } catch(e) { console.log('training log error', e); }
}

async function logPDF(count) {
  if(!currentUser) return;
  const tb = TEXTBOOKS[curSheet];
  if(!tb) return;
  try {
    const pdfMode = tb.subject === 'kanji' ? (getVal('g-kanji-mode')||'yomi') :
                    tb.subject === 'eigo'  ? (getVal('g-eigo-mode')||'ej') :
                    (getVal('g-latex-mode')||'1');
    await sbFetch('pdf_logs', {
      method: 'POST',
      headers: {'Prefer': 'return=minimal'},
      body: JSON.stringify({
        user_id: currentUser.id,
        textbook_key: curSheet,
        textbook_name: tb.label,
        subject: tb.subject,
        count: count,
        pdf_mode: pdfMode
      })
    });
  } catch(e) { console.log('pdf log error', e); }
}

async function sbFetch(path, opts) {
  opts = opts || {};
  const headers = {'apikey': SUPABASE_KEY, 'Authorization': 'Bearer '+SUPABASE_KEY, 'Content-Type': 'application/json'};
  if(opts.headers) Object.assign(headers, opts.headers);
  const res = await fetch(SUPABASE_URL+'/rest/v1/'+path, {method: opts.method||'GET', headers: headers, body: opts.body});
  return res.json();
}
async function login() {
  const username = document.getElementById('login-user').value.trim();
  const password = document.getElementById('login-pass').value.trim();
  if(!username||!password) return;
  document.getElementById('login-err').textContent = '';
  const data = await sbFetch('users?username=eq.'+encodeURIComponent(username)+'&password=eq.'+encodeURIComponent(password)+'&select=*');
  if(!data||!data.length) {
    document.getElementById('login-err').textContent = 'IDまたはパスワードが違います';
    return;
  }
  currentUser = data[0];
  const access = await sbFetch('access?user_id=eq.'+currentUser.id+'&select=textbook_key');
  currentUser.accessKeys = access.map(function(a){return a.textbook_key;});
  document.getElementById('sec-login').style.display = 'none';
  document.getElementById('sec-main').style.display = '';
  document.getElementById('user-name').textContent = currentUser.name || currentUser.username;
  if(currentUser.role === 'teacher') document.getElementById('btn-admin').style.display = '';
  loadUserStats();
  window.loadManageSheet();
}
function logout() {
  currentUser = null;
  document.getElementById('sec-login').style.display = 'flex';
  document.getElementById('sec-main').style.display = 'none';
  document.getElementById('sec-admin').style.display = 'none';
  document.getElementById('btn-admin').style.display = 'none';
}

<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>KRONE Prep - Homework AI</title>

  <link rel="stylesheet" href="css/style.css">
</head>

<body>

<div class="container">

  <h1>KRONE Prep</h1>

  <!-- 生徒 -->
  <div class="panel">
    <input id="studentId" placeholder="生徒ID">
    <button id="loginBtn">ログイン</button>
  </div>

  <!-- 教科 -->
  <div class="panel">
    <select id="subject">
      <option value="国語">国語</option>
      <option value="英語">英語</option>
    </select>
  </div>

  <!-- 教材 -->
  <div class="panel">
    <select id="material"></select>
  </div>

  <!-- 操作 -->
  <div class="panel">
    <button id="startBtn">テスト開始</button>
    <button id="homeworkBtn">宿題生成</button>
  </div>

  <hr>

  <div id="stats"></div>
  <div id="output"></div>

</div>

<script src="./js/main.js"></script>

</body>
</html>

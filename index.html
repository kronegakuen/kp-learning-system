<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>KRONE Prep</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;}
:root{--nv9:#060D1A;--nv8:#0C1B33;--nv7:#0F2240;--nv6:#1A3260;--nv5:#2A4A80;--gold:#BA7517;--gL:#EF9F27;--tb:#EAF1FA;--tm:#B0C4DE;--tmu:#7A9CC0;}
body{font-family:'Hiragino Sans','Meiryo',sans-serif;background:var(--nv9);color:var(--tb);min-height:100vh;}
.wrap{max-width:680px;margin:0 auto;padding:1.5rem 1rem;}
.sec{display:none;}.sec.on{display:block;}
.hd{display:flex;align-items:center;gap:12px;margin-bottom:1.5rem;}
.hd h1{font-size:18px;font-weight:500;flex:1;color:var(--tb);}
.badge{font-size:12px;padding:3px 10px;border-radius:8px;background:var(--gold);color:#fff;}
.block{background:var(--nv7);border:1px solid var(--nv5);border-radius:12px;padding:1rem 1.25rem;margin-bottom:1rem;}
.block-title{font-size:11px;font-weight:500;color:var(--tmu);letter-spacing:.06em;margin-bottom:.875rem;}
.field{margin-bottom:.875rem;}
.field:last-child{margin-bottom:0;}
.field-label{font-size:13px;color:var(--tm);margin-bottom:5px;display:block;}
select{width:100%;padding:8px 10px;font-size:14px;border:1px solid var(--nv5);border-radius:8px;background:var(--nv6);color:var(--tb);appearance:auto;}
input[type=number]{padding:7px 10px;font-size:14px;border:1px solid var(--nv5);border-radius:8px;background:var(--nv6);color:var(--tb);width:72px;text-align:center;}
.chip-group{display:flex;flex-wrap:wrap;gap:7px;}
.chip{font-size:13px;padding:5px 13px;border-radius:8px;border:1.5px solid var(--nv5);background:var(--nv6);color:var(--tmu);cursor:pointer;display:flex;align-items:center;gap:4px;transition:border-color .15s,color .15s;}
.chip:hover{border-color:#999;}
.chip.on{border:2.5px solid var(--gold);color:var(--gL);font-weight:500;background:var(--nv8);}
.chip .ck{font-size:13px;display:none;}
.chip.on .ck{display:inline;}
.range-row{display:flex;align-items:center;gap:8px;}
.range-row span{font-size:13px;color:#666;}
.slider-wrap{display:flex;flex-direction:column;gap:8px;}
.slider-row{display:flex;align-items:center;gap:8px;}
.slider-row label{font-size:13px;color:#666;width:48px;}
.slider-row input[type=range]{flex:1;}
.sval{font-size:13px;font-weight:500;color:#1a1a1a;min-width:34px;}
.btn-action{width:100%;padding:11px;font-size:14px;font-weight:500;border-radius:8px;cursor:pointer;border:none;display:flex;align-items:center;justify-content:center;gap:6px;margin-top:.875rem;}
.btn-action:disabled{opacity:.4;cursor:not-allowed;}
.btn-train{background:var(--gold);color:#fff;}
.btn-pdf-a{background:transparent;color:var(--tm);border:1.5px solid var(--nv5)!important;}
.btn-back{background:#f5f5f0;color:#1a1a1a;border:1.5px solid #d0d0c8!important;max-width:200px;margin:0 auto;}
.end-btn{font-size:13px;padding:5px 14px;border-radius:8px;border:1.5px solid #d0d0c8;background:transparent;color:#666;cursor:pointer;}
.prog-bar{height:4px;background:#e5e5e0;border-radius:2px;margin-bottom:1rem;}
.prog-fill{height:100%;background:var(--gold);border-radius:2px;transition:width .3s;}
.ctr{font-size:13px;color:#666;text-align:center;margin-bottom:1rem;}
.card{background:#fff;border:1px solid #e5e5e0;border-radius:12px;padding:2rem 1.5rem;text-align:center;min-height:180px;display:flex;flex-direction:column;align-items:center;justify-content:center;margin-bottom:1rem;}
.card-type{font-size:12px;color:#888;margin-bottom:.5rem;}
.card-q{font-size:26px;font-weight:500;line-height:1.4;color:#1a1a1a;}
.card-a{font-size:19px;color:#185FA5;font-weight:500;margin-top:1rem;padding-top:1rem;border-top:1px solid #e5e5e0;width:100%;opacity:0;transition:opacity .4s;}
.card-a.show{opacity:1;}
.btn-row{display:flex;gap:10px;margin-bottom:.75rem;}
.btn-row button{flex:1;padding:9px;font-size:14px;border-radius:8px;cursor:pointer;border:1.5px solid #d0d0c8;background:#f5f5f0;color:#1a1a1a;}
.btn-blue{background:#fff!important;border-color:#378ADD!important;color:#185FA5!important;font-weight:500;}
.btn-ok{color:#0F6E56!important;border-color:#5DCAA5!important;}
.btn-ng{color:#A32D2D!important;border-color:#F09595!important;}
.timer-bar{height:4px;background:#e5e5e0;border-radius:2px;margin-bottom:1rem;overflow:hidden;}
.timer-fill{height:100%;border-radius:2px;}
.p-ctrl{display:flex;gap:10px;justify-content:center;}
.end-box{text-align:center;padding:2rem;}
.end-box .big{font-size:22px;font-weight:500;margin-bottom:.5rem;}
.end-box .sub{font-size:14px;color:#666;margin-bottom:1.5rem;}
#pdf-msg{font-size:12px;color:#888;text-align:center;margin-top:6px;min-height:16px;}
.loading{text-align:center;padding:2rem;color:#888;font-size:14px;}
.error-msg{color:#A32D2D;font-size:13px;margin-top:6px;text-align:center;}
</style>
</head>
<body>
<div class="wrap">

<!-- 設定画面 -->
<div class="sec on" id="sec-setup">
  <div class="hd"><h1>KRONE Prep</h1><span class="badge">β版</span><span style="font-size:11px;color:var(--tmu);margin-left:auto">v0.1</span></div>

  <div class="block">
    <div class="block-title">共通設定</div>
    <div class="field">
      <span class="field-label">テキスト</span>
      <select id="sel-sheet" onchange="pickSheet().then(function(){var k=TEXTBOOKS[document.getElementById('sel-sheet').value];if(k){var isK=k.subject==='kanji';document.querySelector('[data-v=normal]').innerHTML='<span class=ck>✓</span>'+(isK?'書き練習（読み→漢字）':'言葉→意味');document.querySelector('[data-v=reverse]').innerHTML='<span class=ck>✓</span>'+(isK?'読み練習（漢字→読み）':'意味→言葉');}})">
        <option value="">── 読み込み中... ──</option>
      </select>
      <div class="error-msg" id="load-error" style="display:none"></div>
    </div>
    <div class="field" id="field-genre" style="display:none">
      <span class="field-label">ジャンル</span>
      <div class="chip-group" id="g-genre"></div>
    </div>
    <div class="field">
      <span class="field-label">問題番号の範囲</span>
      <div class="range-row">
        <input type="number" id="rng-from" value="1" min="1">
        <span>〜</span>
        <input type="number" id="rng-to" value="30" min="1">
        <span id="rng-hint" style="font-size:12px;color:#aaa"></span>
      </div>
    </div>
    <div class="field">
      <span class="field-label">出題方向</span>
      <div class="chip-group" id="g-dir">
        <button class="chip on" data-v="normal" onclick="pickChip('g-dir',this)"><span class="ck">✓</span>言葉→意味</button>
        <button class="chip" data-v="reverse" onclick="pickChip('g-dir',this)"><span class="ck">✓</span>意味→言葉</button>
        <button class="chip" data-v="both" onclick="pickChip('g-dir',this)"><span class="ck">✓</span>両方向</button>
      </div>
    </div>
  </div>

  <div class="block">
    <div class="block-title">トレーニング設定</div>
    <div class="field">
      <span class="field-label">出題数</span>
      <div class="chip-group" id="g-count">
        <button class="chip" data-v="5" onclick="pickChip('g-count',this)"><span class="ck">✓</span>5問</button>
        <button class="chip on" data-v="10" onclick="pickChip('g-count',this)"><span class="ck">✓</span>10問</button>
        <button class="chip" data-v="20" onclick="pickChip('g-count',this)"><span class="ck">✓</span>20問</button>
        <button class="chip" data-v="all" onclick="pickChip('g-count',this)"><span class="ck">✓</span>全問</button>
      </div>
    </div>
    <div class="field">
      <span class="field-label">モード</span>
      <div class="chip-group" id="g-mode">
        <button class="chip on" data-v="active" onclick="pickMode(this)"><span class="ck">✓</span>チェックモード</button>
        <button class="chip" data-v="passive" onclick="pickMode(this)"><span class="ck">✓</span>オートモード</button>
      </div>
    </div>
    <div id="field-timer" style="display:none;margin-top:.75rem">
      <span class="field-label">オートモードの表示時間</span>
      <div class="slider-wrap">
        <div class="slider-row">
          <label>問題</label>
          <input type="range" min="1" max="10" step="1" value="3" id="sl-q" oninput="document.getElementById('sv-q').textContent=this.value+'秒'">
          <span class="sval" id="sv-q">3秒</span>
        </div>
        <div class="slider-row">
          <label>答え</label>
          <input type="range" min="1" max="10" step="1" value="4" id="sl-a" oninput="document.getElementById('sv-a').textContent=this.value+'秒'">
          <span class="sval" id="sv-a">4秒</span>
        </div>
      </div>
    </div>
    <button class="btn-action btn-train" id="btn-start" onclick="startTraining()" disabled>
      ▶ トレーニング開始
    </button>
  </div>

  <div class="block">
    <div class="block-title">PDF設定</div>
    <div class="field">
      <span class="field-label">出題数</span>
      <div class="chip-group" id="g-pdf-count">
        <button class="chip" data-v="20" onclick="pickChip('g-pdf-count',this)"><span class="ck">✓</span>20問</button>
        <button class="chip" data-v="25" onclick="pickChip('g-pdf-count',this)"><span class="ck">✓</span>25問</button>
        <button class="chip on" data-v="30" onclick="pickChip('g-pdf-count',this)"><span class="ck">✓</span>30問</button>
        <button class="chip" data-v="all" onclick="pickChip('g-pdf-count',this)"><span class="ck">✓</span>全問</button>
      </div>
    </div>
    <button class="btn-action btn-pdf-a" id="btn-pdf" onclick="makePDF()" disabled>
      📄 PDFを作る
    </button>
    <div id="pdf-msg"></div>
  </div>
</div>

<!-- チェックモード -->
<div class="sec" id="sec-active">
  <div class="hd"><h1 id="a-title">トレーニング</h1><button class="end-btn" onclick="goSetup()">終了</button></div>
  <div class="prog-bar"><div class="prog-fill" id="a-prog" style="width:0%"></div></div>
  <div class="ctr" id="a-ctr"></div>
  <div class="card">
    <div class="card-type" id="a-type"></div>
    <div class="card-q" id="a-q"></div>
    <div class="card-a" id="a-ans"></div>
  </div>
  <div class="btn-row"><button class="btn-blue" id="btn-reveal" onclick="revealAnswer()">答えを見る</button></div>
  <div class="btn-row" id="judge-row" style="display:none">
    <button class="btn-ng" onclick="judge()">✕ もう一度</button>
    <button class="btn-ok" onclick="judge()">○ 正解</button>
  </div>
</div>

<!-- オートモード -->
<div class="sec" id="sec-passive">
  <div class="hd"><h1>オートモード</h1><button class="end-btn" onclick="goSetup()">終了</button></div>
  <div class="timer-bar"><div class="timer-fill" id="p-timer" style="background:#378ADD;width:100%"></div></div>
  <div class="ctr" id="p-ctr"></div>
  <div class="card">
    <div class="card-type" id="p-type"></div>
    <div class="card-q" id="p-q"></div>
    <div class="card-a" id="p-ans"></div>
  </div>
  <div class="p-ctrl">
    <button class="chip" id="btn-pause" onclick="togglePause()">⏸ 一時停止</button>
    <button class="chip" onclick="skipPassive()">→ 次へ</button>
  </div>
</div>

<!-- 完了画面 -->
<div class="sec" id="sec-end">
  <div class="end-box">
    <div class="big">お疲れさまでした！</div>
    <div class="sub" id="end-msg"></div>
    <button class="btn-action btn-back" onclick="goSetup()">← 設定に戻る</button>
  </div>
</div>

</div>
<script>
// ============================================================
// 設定（ここだけ変更すればOK）
// ============================================================
const SHEET_ID = '1eKa9ATYPEp8DV-10L96PkOuHfQsTXlIuxSS8KGZ9PaY';
const MANAGE_SHEET = '管理';

// ============================================================
// データ
// ============================================================
let TEXTBOOKS = {};   // { key: {label, sheetName, subject, ansWidth, genres, items} }
let curSheet = null, curGenres = [], queue = [], idx = 0;
let paused = false, rafId = null, phaseStart = 0, phase = 'q';

// ============================================================
// CSV取得・パース
// ============================================================
function csvUrl(sheetName){
  return `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:csv&sheet=${encodeURIComponent(sheetName)}`;
}

function parseCSV(text){
  const rows = [];
  const lines = text.split('\n');
  for(const line of lines){
    if(!line.trim()) continue;
    const cols = [];
    let inQ = false, cur = '';
    for(let i=0;i<line.length;i++){
      const c = line[i];
      if(c==='"'){ inQ=!inQ; continue; }
      if(c===','&&!inQ){ cols.push(cur.trim()); cur=''; continue; }
      cur+=c;
    }
    cols.push(cur.trim());
    rows.push(cols);
  }
  return rows;
}

// ============================================================
// 起動時：管理シートを読んでテキスト一覧を生成
// ============================================================
async function loadManageSheet(){
  try{
    const res = await fetch(csvUrl(MANAGE_SHEET));
    if(!res.ok) throw new Error('管理シートの読み込みに失敗しました');
    const text = await res.text();
    const rows = parseCSV(text);
    // 1行目はヘッダー（テキスト名, シート名, 科目, 答え欄）
    const sel = document.getElementById('sel-sheet');
    sel.innerHTML = '<option value="">── テキストを選ぶ ──</option>';
    TEXTBOOKS = {};
    for(let i=1;i<rows.length;i++){
      const [label, sheetName, subject, ansWidth] = rows[i];
      if(!label||!sheetName) continue;
      const key = 'tb_'+i;
      TEXTBOOKS[key] = {
        label: label.trim(),
        sheetName: sheetName.trim(),
        subject: (subject||'kokugo').trim(),
        ansWidth: (ansWidth||'medium').trim(),
        genres: null,
        items: null
      };
      const opt = document.createElement('option');
      opt.value = key;
      opt.textContent = label.trim();
      sel.appendChild(opt);
    }
  } catch(e){
    document.getElementById('load-error').style.display='';
    document.getElementById('load-error').textContent = 'テキスト一覧の読み込みに失敗しました。スプレッドシートの共有設定を確認してください。';
    const sel = document.getElementById('sel-sheet');
    sel.innerHTML = '<option value="">── 読み込み失敗 ──</option>';
  }
}

// ============================================================
// テキスト選択時：該当シートを読み込む
// ============================================================
async function pickSheet(){
  const sel = document.getElementById('sel-sheet');
  curSheet = sel.value || null;
  const gf = document.getElementById('field-genre');
  const gg = document.getElementById('g-genre');
  gg.innerHTML=''; curGenres=[];
  document.getElementById('btn-start').disabled=true;
  document.getElementById('btn-pdf').disabled=true;
  document.getElementById('rng-hint').textContent='';
  gf.style.display='none';

  if(!curSheet) return;

  const tb = TEXTBOOKS[curSheet];
  document.getElementById('rng-hint').textContent='読み込み中...';

  try{
    const res = await fetch(csvUrl(tb.sheetName));
    if(!res.ok) throw new Error('シートの読み込みに失敗');
    const text = await res.text();
    const rows = parseCSV(text);

    // 2行目以降がデータ（1行目はヘッダー）
    const isEigo = tb.subject === 'eigo';
    const items = [];
    const genreSet = new Set();

    for(let i=1;i<rows.length;i++){
      const r = rows[i];
      if(!r[0]) continue;
      const no = parseInt(r[0])||i;
      if(isEigo){
        // A:番号 B:学年 C:テキスト D:英単語 E:意味
        items.push({ no, word: (r[3]||'').trim(), meaning: (r[4]||'').trim(), genre: '英→日' });
      } else {
        // A:番号 B:学年 C:テキスト D:種別 E:言葉 F:意味
        const genre = (r[3]||'').trim();
        items.push({ no, word: (r[4]||'').trim(), meaning: (r[5]||'').trim(), genre });
        if(genre) genreSet.add(genre);
      }
    }

    tb.items = items;

    // ジャンル（国語のみ・2種類以上あれば表示）
    if(!isEigo && genreSet.size > 1){
      tb.genres = [...genreSet];
      gf.style.display='';
      tb.genres.forEach(g=>{
        const b = document.createElement('button');
        b.className='chip on'; b.dataset.v=g;
        b.innerHTML='<span class="ck">✓</span>'+g;
        b.onclick=()=>toggleGenre(b,g);
        gg.appendChild(b);
        curGenres.push(g);
      });
    } else {
      tb.genres = null;
    }

    document.getElementById('rng-to').value = items.length;
    document.getElementById('rng-hint').textContent = '（全'+items.length+'問）';
    document.getElementById('btn-start').disabled=false;
    document.getElementById('btn-pdf').disabled=false;

  } catch(e){
    document.getElementById('rng-hint').textContent='読み込みに失敗しました';
  }
}

function toggleGenre(el, g){
  el.classList.toggle('on');
  if(el.classList.contains('on')) curGenres.push(g);
  else curGenres = curGenres.filter(x=>x!==g);
}

// ============================================================
// UI共通
// ============================================================
function showSec(id){
  document.querySelectorAll('.sec').forEach(s=>s.classList.remove('on'));
  document.getElementById(id).classList.add('on');
}
function goSetup(){ stopPassive(); showSec('sec-setup'); }

function pickChip(gid, el){
  document.querySelectorAll('#'+gid+' .chip').forEach(b=>b.classList.remove('on'));
  el.classList.add('on');
}
function pickMode(el){
  pickChip('g-mode', el);
  document.getElementById('field-timer').style.display = el.dataset.v==='passive' ? '' : 'none';
}
function getVal(gid){
  const a = document.querySelector('#'+gid+' .chip.on');
  return a ? a.dataset.v : null;
}
function shuffle(a){
  for(let i=a.length-1;i>0;i--){
    const j=Math.floor(Math.random()*(i+1));
    [a[i],a[j]]=[a[j],a[i]];
  }
  return a;
}

// ============================================================
// キュー構築
// ============================================================
function buildQueue(countGroup){
  const tb = TEXTBOOKS[curSheet];
  const from = parseInt(document.getElementById('rng-from').value)||1;
  const to   = parseInt(document.getElementById('rng-to').value)||tb.items.length;
  const dir  = getVal('g-dir')||'normal';
  let base = tb.items.filter(d=>d.no>=from && d.no<=to);
  if(tb.genres && curGenres.length>0)
    base = base.filter(d=>curGenres.includes(d.genre));
  let items=[];
  if(dir==='normal'||dir==='both') base.forEach(d=>items.push({q:d.word, a:d.meaning, type:d.genre}));
  if(dir==='reverse'||dir==='both') base.forEach(d=>items.push({q:d.meaning, a:d.word, type:d.genre+'（逆）'}));
  shuffle(items);
  const n = getVal(countGroup)||'10';
  return n==='all' ? items : items.slice(0, parseInt(n));
}

// ============================================================
// チェックモード
// ============================================================
function startTraining(){
  if(!curSheet) return;
  queue=buildQueue('g-count'); idx=0;
  const mode = getVal('g-mode')||'active';
  if(mode==='active'){ showSec('sec-active'); renderActive(); }
  else { showSec('sec-passive'); startPassive(); }
}
function renderActive(){
  if(idx>=queue.length){
    showSec('sec-end');
    document.getElementById('end-msg').textContent=queue.length+'問 完了';
    return;
  }
  const item=queue[idx], tot=queue.length;
  document.getElementById('a-prog').style.width=(idx/tot*100)+'%';
  document.getElementById('a-ctr').textContent=(idx+1)+' / '+tot;
  document.getElementById('a-type').textContent=item.type;
  document.getElementById('a-q').textContent=item.q;
  document.getElementById('a-ans').textContent=item.a;
  document.getElementById('a-ans').classList.remove('show');
  document.getElementById('btn-reveal').style.display='';
  document.getElementById('judge-row').style.display='none';
}
function revealAnswer(){
  document.getElementById('a-ans').classList.add('show');
  document.getElementById('btn-reveal').style.display='none';
  document.getElementById('judge-row').style.display='flex';
}
function judge(){ idx++; renderActive(); }

// ============================================================
// オートモード
// ============================================================
function getQms(){ return parseInt(document.getElementById('sl-q').value)*1000; }
function getAms(){ return parseInt(document.getElementById('sl-a').value)*1000; }

function startPassive(){
  paused=false; phase='q'; phaseStart=performance.now();
  renderPassiveCard();
  cancelAnimationFrame(rafId);
  rafId=requestAnimationFrame(tickPassive);
}
function renderPassiveCard(){
  if(idx>=queue.length){
    stopPassive(); showSec('sec-end');
    document.getElementById('end-msg').textContent=queue.length+'問 完了（オートモード）';
    return;
  }
  const item=queue[idx];
  document.getElementById('p-type').textContent=item.type;
  document.getElementById('p-q').textContent=item.q;
  document.getElementById('p-ans').textContent=item.a;
  document.getElementById('p-ans').classList.remove('show');
  document.getElementById('p-ctr').textContent=(idx+1)+' / '+queue.length;
  document.getElementById('p-timer').style.background='#378ADD';
  document.getElementById('p-timer').style.width='100%';
}
function tickPassive(now){
  if(paused){ rafId=requestAnimationFrame(tickPassive); return; }
  const dur = phase==='q' ? getQms() : getAms();
  const pct = Math.max(0, 1-(now-phaseStart)/dur);
  document.getElementById('p-timer').style.width=(pct*100)+'%';
  if(now-phaseStart>=dur){
    if(phase==='q'){
      phase='a'; phaseStart=now;
      document.getElementById('p-ans').classList.add('show');
      document.getElementById('p-timer').style.background='#1D9E75';
      document.getElementById('p-timer').style.width='100%';
    } else {
      idx++; phase='q'; phaseStart=now; renderPassiveCard();
    }
  }
  rafId=requestAnimationFrame(tickPassive);
}
function skipPassive(){
  cancelAnimationFrame(rafId);
  idx++; phase='q'; phaseStart=performance.now();
  renderPassiveCard();
  rafId=requestAnimationFrame(tickPassive);
}
function stopPassive(){ cancelAnimationFrame(rafId); rafId=null; }
function togglePause(){
  paused=!paused;
  const btn=document.getElementById('btn-pause');
  if(paused){
    btn.classList.add('on');
    btn.textContent='▶ 再開';
  } else {
    btn.classList.remove('on');
    btn.textContent='⏸ 一時停止';
    phaseStart=performance.now()-(phase==='q'?getQms():getAms())*(1-parseFloat(document.getElementById('p-timer').style.width)/100);
  }
}

// ============================================================
// PDF生成
// ============================================================
function makePDF(){
  if(!curSheet) return;
  const msg = document.getElementById('pdf-msg');
  msg.textContent = '新しいタブを開いています...';
  const qs = buildQueue('g-pdf-count');
  const tb = TEXTBOOKS[curSheet];
  const sheetLabel = tb.label;
  const ansWidth = tb.ansWidth;
  const isEigo = tb.subject === 'eigo';
  const dir = getVal('g-dir')||'normal';
  const dirLabel = {normal:'言葉→意味', reverse:'意味→言葉', both:'両方向'}[dir]||'';
  const from = document.getElementById('rng-from').value;
  const to   = document.getElementById('rng-to').value;
  const subtitle = sheetLabel+'　No.'+from+'〜'+to+'　'+dirLabel+'　'+qs.length+'問';

  let html = '';

  if(isEigo){
    // ==============================
    // 英語：横書きレイアウト
    // ==============================
    const cols = qs.length <= 15 ? 1 : 2;
    const ansH = ansWidth==='wide' ? '12mm' : ansWidth==='narrow' ? '7mm' : '9mm';
    function qCellH(item,n){
      return `<td class="qcell"><div class="qtype">[${item.type}]</div><div class="qtxt">Q${n}．${item.q}</div><div class="ans-box" style="height:${ansH}"></div></td>`;
    }
    function aCellH(item,n){
      return `<td class="qcell"><div class="qtype">[${item.type}]</div><div class="qtxt">Q${n}．${item.q}</div><div class="atxt">→ ${item.a}</div></td>`;
    }
    let qRows='', aRows='';
    if(cols===1){
      qs.forEach((item,i)=>{ qRows+=`<tr>${qCellH(item,i+1)}</tr>`; aRows+=`<tr>${aCellH(item,i+1)}</tr>`; });
    } else {
      for(let i=0;i<qs.length;i+=2){
        const l=qs[i],r=qs[i+1];
        qRows+=`<tr>${qCellH(l,i+1)}${r?qCellH(r,i+2):'<td class="qcell empty"></td>'}</tr>`;
        aRows+=`<tr>${aCellH(l,i+1)}${r?aCellH(r,i+2):'<td class="qcell empty"></td>'}</tr>`;
      }
    }
    const colStyle = cols===1?'table{width:100%;}.qcell{width:100%;}':'table{width:100%;}.qcell{width:50%;}';
    html=`<!DOCTYPE html><html lang="ja"><head><meta charset="UTF-8"><title>${sheetLabel}テスト</title>
<style>
@page{size:A4;margin:15mm;}
@media print{.no-print{display:none!important;}body{margin:0;}}
body{font-family:'Hiragino Sans','Meiryo',sans-serif;font-size:10pt;margin:0;color:#000;}
.page{width:180mm;margin:0 auto;}
h1{font-size:13pt;font-weight:bold;text-align:center;margin:0 0 2mm;border-bottom:0.5pt solid #000;padding-bottom:2mm;}
.sub{font-size:8pt;color:#555;text-align:center;margin-bottom:3mm;}
.info{font-size:9pt;margin-bottom:4mm;line-height:2;}
table{border-collapse:collapse;table-layout:fixed;}${colStyle}
.qcell{vertical-align:top;padding:2mm 2.5mm 2.5mm;border:0.3pt solid #bbb;}
.qcell.empty{border:0.3pt solid #bbb;background:#fafafa;}
.qtype{font-size:7pt;color:#888;margin-bottom:0.5mm;}
.qtxt{font-size:10.5pt;font-weight:bold;line-height:1.45;margin-bottom:1.5mm;}
.ans-box{border-bottom:0.5pt solid #999;margin-top:1mm;}
.atxt{font-size:10pt;color:#1a4f8a;font-weight:bold;line-height:1.4;margin-top:1mm;padding-top:1mm;border-top:0.3pt solid #ccc;}
.page-break{page-break-before:always;padding-top:5mm;}
.no-print{text-align:center;padding:10px;background:#eef3f8;border-bottom:1px solid #ccd;}
.no-print button{padding:7px 20px;font-size:11pt;cursor:pointer;margin:0 5px;border-radius:6px;border:1px solid #aaa;}
.pbtn{background:#185FA5;color:#fff;border-color:#185FA5!important;}
</style></head><body>
<div class="no-print">
  <button class="pbtn" onclick="window.print()">印刷する / PDFで保存</button>
  <button onclick="window.close()">閉じる</button>
</div>
<div class="page">
  <h1>${sheetLabel}　問題</h1>
  <div class="sub">${subtitle}</div>
  <div class="info">クラス：___________　名前：___________________　点数：______／${qs.length}</div>
  <table>${qRows}</table>
</div>
<div class="page page-break">
  <h1>${sheetLabel}　解答</h1>
  <div class="sub">${subtitle}</div>
  <table>${aRows}</table>
</div>
</body></html>`;


  } else {
    // ==============================
    // 国語：縦書きレイアウト（語彙チェック方式）
    // ==============================
    // 各問を固定高さの縦長ブロックとして右から左に並べる
    const mondaiMode = getVal('g-latex-mode')||'1';
    // ansWidthで上段（ことわざ）エリアと下段（意味）エリアの高さを決める
    // 全体高さ170mm固定、上段:下段 = 約45:110mm（語彙チェックと同比率）
    const BLOCK_H = 170; // mm
    const TOP_H   = 45;  // mm（上段：ことわざ）
    const BOT_H   = 110; // mm（下段：意味）
    const SEP_Y   = TOP_H; // 境界線の位置

    function makeBlock(item, n, mode){
      // mode: '1'=上段空欄 '2'=下段空欄 '3'=ランダム '0'=両方表示（解答）
      const rand = Math.random() < 0.5;
      let showTop, showBot;
      if(mode==='0'){ showTop=true; showBot=true; }
      else if(mode==='1'){ showTop=false; showBot=true; }
      else if(mode==='2'){ showTop=true; showBot=false; }
      else { showTop=rand; showBot=!rand; }

      const topContent = showTop
        ? `<div class="vword">${item.q}</div>`
        : `<div class="vblank"></div>`;
      const botContent = showBot
        ? `<div class="vmean">${item.a}</div>`
        : `<div class="vblank"></div>`;

      return `<div class="mblock">
  <div class="mno">${n}</div>
  <div class="msep"></div>
  <div class="mtop">${topContent}</div>
  <div class="mbot">${botContent}</div>
</div>`;
    }

    let blocks = qs.map((item,i) => makeBlock(item, i+1, mondaiMode)).join('');

    html=`<!DOCTYPE html><html lang="ja"><head><meta charset="UTF-8">
<title>${sheetLabel}テスト</title>
<style>
@page{size:A4 landscape;margin:8mm 10mm;}
@media print{.no-print{display:none!important;}body{margin:0;}}
body{font-family:'Hiragino Sans','Meiryo',sans-serif;margin:0;color:#000;background:#fff;}
.no-print{text-align:center;padding:8px;background:#eef3f8;border-bottom:1px solid #ccd;margin-bottom:4mm;}
.no-print button{padding:6px 18px;font-size:10pt;cursor:pointer;margin:0 4px;border-radius:6px;border:1px solid #aaa;}
.pbtn{background:#185FA5;color:#fff;border-color:#185FA5!important;}
.page{display:flex;flex-direction:column;}
.phead{display:flex;align-items:baseline;justify-content:center;gap:8mm;margin-bottom:2mm;}
.ptitle{font-size:13pt;font-weight:bold;border-bottom:0.5pt solid #000;padding-bottom:1mm;}
.psub{font-size:8pt;color:#555;}
.pinfo{font-size:9pt;margin-bottom:3mm;writing-mode:horizontal-tb;}
.mrow{
  display:flex;
  flex-direction:row-reverse;
  align-items:flex-start;
  gap:0;
  height:${BLOCK_H}mm;
}
.mblock{
  writing-mode:vertical-rl;
  text-orientation:mixed;
  border:0.4pt solid #aaa;
  border-right:none;
  flex-shrink:0;
  width:13mm;
  height:${BLOCK_H}mm;
  position:relative;
  display:flex;
  flex-direction:column;
  align-items:center;
  overflow:hidden;
}
.mblock:last-child{
  border-right:0.4pt solid #aaa;
}
.mno{
  background:#2E86C1;
  color:#fff;
  font-size:7pt;
  font-weight:bold;
  width:100%;
  height:6mm;
  display:flex;
  align-items:center;
  justify-content:center;
  writing-mode:horizontal-tb;
  flex-shrink:0;
}
.msep{
  width:100%;
  border-bottom:1pt dashed #E74C3C;
  flex-shrink:0;
  margin-top:${TOP_H - 6}mm;
  position:absolute;
  top:${TOP_H}mm;
  left:0;
}
.mtop{
  width:100%;
  height:${TOP_H - 6}mm;
  display:flex;
  align-items:flex-start;
  justify-content:center;
  padding:1mm 1mm 0;
  flex-shrink:0;
  margin-top:0;
}
.mbot{
  width:100%;
  height:${BOT_H}mm;
  display:flex;
  align-items:flex-start;
  justify-content:center;
  padding:1mm 1mm 0;
  flex-shrink:0;
  margin-top:${TOP_H - 6}mm;
  position:absolute;
  top:${TOP_H}mm;
  left:0;
}
.vword{
  font-size:10pt;
  font-weight:bold;
  line-height:1.6;
  writing-mode:vertical-rl;
}
.vmean{
  font-size:8pt;
  line-height:1.6;
  writing-mode:vertical-rl;
}
.vblank{
  width:80%;
  height:100%;
  writing-mode:vertical-rl;
}
.vtitle-block{
  writing-mode:vertical-rl;
  border:none;
  flex-shrink:0;
  width:14mm;
  height:${BLOCK_H}mm;
  display:flex;
  align-items:center;
  justify-content:center;
  margin-left:3mm;
}
.vtitle-text{
  font-size:14pt;
  font-weight:bold;
  writing-mode:vertical-rl;
  line-height:1.4;
}
</style></head><body>
<div class="no-print">
  <button class="pbtn" onclick="window.print()">印刷する / PDFで保存</button>
  <button onclick="window.close()">閉じる</button>
</div>
<div class="page">
  <div class="pinfo">クラス：___________　名前：___________________　点数：______／${qs.length}</div>
  <div class="mrow">
    ${blocks}
    <div class="vtitle-block">
      <div class="vtitle-text">${sheetLabel}<br><span style="font-size:8pt;font-weight:normal">${subtitle}</span></div>
    </div>
  </div>
</div>
</body></html>`;
  }

  // 共通：タブを開く
  const blob=new Blob([html],{type:'text/html;charset=utf-8'});
  const url=URL.createObjectURL(blob);
  const w=window.open(url,'_blank');
  if(w){
    msg.textContent='タブが開いたら「印刷する / PDFで保存」を押してください。';
    setTimeout(()=>URL.revokeObjectURL(url),120000);
  } else {
    msg.textContent='ポップアップがブロックされました。ブラウザの設定で許可してください。';
  }
  setTimeout(()=>{ msg.textContent=''; },8000);
}

// 起動
// ============================================================
loadManageSheet();
</script>

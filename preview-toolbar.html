<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ツールバー スマホ デザイン案</title>
<link href="https://fonts.googleapis.com/css2?family=Kaisei+Opti&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0;}
body{background:#0a1020;padding:24px 12px;font-family:'Hiragino Sans','Meiryo',sans-serif;color:#eee;display:flex;flex-direction:column;gap:28px;align-items:center;}
:root{--nv9:#131E30;--nv8:#172540;--nv7:#1C2E48;--nv6:#2A4070;--nv5:#3A5A90;--gold:#BA7517;--gL:#EF9F27;--tb:#EDF3FA;--tmu:#82A0BF;}

.col{display:flex;flex-direction:column;gap:6px;width:375px;}
.lbl{font-size:11px;color:#666;border-bottom:1px solid #1a2a40;padding-bottom:5px;}
.lbl b{font-size:12px;color:#bbb;}
.phone{width:375px;background:var(--nv9);border-radius:12px;border:2px solid #333;overflow:hidden;}

.gold-line{border-top:2px solid var(--gold);padding:9px 12px;display:flex;align-items:center;gap:8px;}
.user-nm{font-family:'Kaisei Opti',serif;font-size:14px;color:var(--gL);}
.user-ic{width:26px;height:26px;border-radius:50%;background:var(--nv6);display:flex;align-items:center;justify-content:center;font-size:12px;flex-shrink:0;}
.dot{position:absolute;top:-3px;right:-3px;width:7px;height:7px;background:var(--gL);border-radius:50%;border:1.5px solid var(--nv9);}
</style>
</head>
<body>

<!-- 現在（折り返しあり） -->
<div class="col">
  <div class="lbl"><b>現在</b>　折り返しが発生（比較用）</div>
  <div class="phone">
    <div class="gold-line">
      <div style="display:flex;align-items:center;gap:7px;margin-right:auto;">
        <div class="user-ic">👤</div>
        <span class="user-nm">テスト先生</span>
      </div>
      <button style="font-size:12px;padding:5px 13px;border-radius:7px;border:1px solid var(--gold);background:transparent;color:var(--gL);cursor:pointer;">管理</button>
      <div style="position:relative;display:inline-block;">
        <button style="font-size:12px;padding:5px 13px;border-radius:7px;border:1.5px solid var(--gL);background:transparent;color:var(--gL);font-weight:600;cursor:pointer;">学習記録</button>
        <span class="dot"></span>
      </div>
      <button style="font-size:12px;padding:5px 8px;border-radius:7px;border:1px solid var(--nv5);background:transparent;color:var(--tmu);cursor:pointer;">🌙</button>
      <button style="font-size:12px;padding:5px 13px;border-radius:7px;border:1px solid var(--nv5);background:transparent;color:var(--tmu);cursor:pointer;">ログアウト</button>
    </div>
  </div>
</div>

<!-- 案A: white-space:nowrap + フォント小さく -->
<div class="col">
  <div class="lbl"><b>案A</b>　文字を小さく・折り返し禁止</div>
  <div class="phone">
    <div class="gold-line" style="gap:6px;">
      <div style="display:flex;align-items:center;gap:6px;margin-right:auto;min-width:0;overflow:hidden;">
        <div class="user-ic">👤</div>
        <span class="user-nm" style="font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">テスト先生</span>
      </div>
      <button style="font-size:11px;padding:4px 9px;border-radius:6px;border:1px solid var(--gold);background:transparent;color:var(--gL);white-space:nowrap;cursor:pointer;">管理</button>
      <div style="position:relative;display:inline-block;">
        <button style="font-size:11px;padding:4px 9px;border-radius:6px;border:1.5px solid var(--gL);background:transparent;color:var(--gL);font-weight:600;white-space:nowrap;cursor:pointer;">学習記録</button>
        <span class="dot"></span>
      </div>
      <button style="font-size:13px;padding:4px 8px;border-radius:6px;border:1px solid var(--nv5);background:transparent;color:var(--tmu);white-space:nowrap;cursor:pointer;">🌙</button>
      <button style="font-size:11px;padding:4px 9px;border-radius:6px;border:1px solid var(--nv5);background:transparent;color:var(--tmu);white-space:nowrap;cursor:pointer;">ログアウト</button>
    </div>
  </div>
</div>

<!-- 案B: ラベル短縮 + アイコン化 -->
<div class="col">
  <div class="lbl"><b>案B</b>　ラベルを短縮・テーマはアイコンのみ</div>
  <div class="phone">
    <div class="gold-line" style="gap:6px;">
      <div style="display:flex;align-items:center;gap:6px;margin-right:auto;">
        <div class="user-ic">👤</div>
        <span class="user-nm" style="white-space:nowrap;">テスト先生</span>
      </div>
      <button style="font-size:11px;padding:4px 10px;border-radius:6px;border:1px solid var(--gold);background:transparent;color:var(--gL);white-space:nowrap;cursor:pointer;">管理</button>
      <div style="position:relative;display:inline-block;">
        <button style="font-size:11px;padding:4px 10px;border-radius:6px;border:1.5px solid var(--gL);background:transparent;color:var(--gL);font-weight:600;white-space:nowrap;cursor:pointer;">記録</button>
        <span class="dot"></span>
      </div>
      <button style="width:30px;height:30px;border-radius:6px;border:1px solid var(--nv5);background:transparent;color:var(--tmu);cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:14px;">🌙</button>
      <button style="width:30px;height:30px;border-radius:6px;border:1px solid var(--nv5);background:transparent;color:var(--tmu);cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:14px;">⏻</button>
    </div>
  </div>
</div>

<!-- 案C: 2行レイアウト（名前行 / ボタン行） -->
<div class="col">
  <div class="lbl"><b>案C</b>　名前とボタンを2行に分ける</div>
  <div class="phone">
    <div style="border-top:2px solid var(--gold);padding:8px 12px 10px;display:flex;flex-direction:column;gap:7px;">
      <div style="display:flex;align-items:center;gap:6px;">
        <div class="user-ic">👤</div>
        <span class="user-nm">テスト先生</span>
      </div>
      <div style="display:flex;align-items:center;gap:6px;">
        <button style="font-size:11px;padding:4px 12px;border-radius:6px;border:1px solid var(--gold);background:transparent;color:var(--gL);white-space:nowrap;cursor:pointer;">管理</button>
        <div style="position:relative;display:inline-block;">
          <button style="font-size:11px;padding:4px 12px;border-radius:6px;border:1.5px solid var(--gL);background:transparent;color:var(--gL);font-weight:600;white-space:nowrap;cursor:pointer;">学習記録</button>
          <span class="dot"></span>
        </div>
        <button style="width:28px;height:28px;border-radius:6px;border:1px solid var(--nv5);background:transparent;color:var(--tmu);cursor:pointer;font-size:13px;">🌙</button>
        <button style="font-size:11px;padding:4px 12px;border-radius:6px;border:1px solid var(--nv5);background:transparent;color:var(--tmu);white-space:nowrap;cursor:pointer;">ログアウト</button>
      </div>
    </div>
  </div>
</div>

<!-- 案D: ユーザー名を左、ボタンをまとめて右 -->
<div class="col">
  <div class="lbl"><b>案D</b>　名前左固定・ボタンをスクロール可能エリアに</div>
  <div class="phone">
    <div style="border-top:2px solid var(--gold);padding:8px 12px;display:flex;align-items:center;gap:8px;">
      <div style="display:flex;align-items:center;gap:6px;flex-shrink:0;">
        <div class="user-ic">👤</div>
        <span class="user-nm" style="white-space:nowrap;">テスト先生</span>
      </div>
      <div style="display:flex;align-items:center;gap:5px;margin-left:auto;overflow-x:auto;flex-shrink:0;">
        <button style="font-size:11px;padding:4px 10px;border-radius:6px;border:1px solid var(--gold);background:transparent;color:var(--gL);white-space:nowrap;cursor:pointer;flex-shrink:0;">管理</button>
        <div style="position:relative;display:inline-block;flex-shrink:0;">
          <button style="font-size:11px;padding:4px 10px;border-radius:6px;border:1.5px solid var(--gL);background:transparent;color:var(--gL);font-weight:600;white-space:nowrap;cursor:pointer;">学習記録</button>
          <span class="dot"></span>
        </div>
        <button style="width:28px;height:28px;border-radius:6px;border:1px solid var(--nv5);background:transparent;color:var(--tmu);cursor:pointer;font-size:13px;flex-shrink:0;">🌙</button>
        <button style="font-size:11px;padding:4px 10px;border-radius:6px;border:1px solid var(--nv5);background:transparent;color:var(--tmu);white-space:nowrap;cursor:pointer;flex-shrink:0;">ログアウト</button>
      </div>
    </div>
  </div>
</div>

</body>
</html>

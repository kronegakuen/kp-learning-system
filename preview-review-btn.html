<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>要復習リスト ボタンデザイン案</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;}
body{background:#080f1c;padding:32px 16px;font-family:'Hiragino Sans','Meiryo',sans-serif;color:#eee;display:flex;flex-direction:column;gap:28px;align-items:center;}
:root{--nv9:#131E30;--nv8:#172540;--nv7:#1C2E48;--nv6:#2A4070;--nv5:#3A5A90;--gold:#BA7517;--gL:#EF9F27;--tb:#EDF3FA;--tmu:#82A0BF;}

.row{width:375px;display:flex;flex-direction:column;gap:8px;}
.lbl{font-size:11px;color:#666;border-bottom:1px solid #1a1a2e;padding-bottom:5px;}
.lbl b{font-size:12px;color:#bbb;}

/* トレーニング開始ボタン（比較用・固定） */
.btn-train{width:100%;padding:14px;border-radius:10px;font-size:15px;font-weight:700;cursor:pointer;border:none;background:linear-gradient(135deg,var(--gold),var(--gL));color:#fff;letter-spacing:.04em;}

/* ===== 案1: 現在（アウトライン ピンク） ===== */
.a1{width:100%;padding:10px;background:transparent;border:1.5px solid #F09595;border-radius:8px;color:#F09595;font-size:13px;cursor:pointer;}

/* ===== 案2: アイコン左・薄い背景 ===== */
.a2{width:100%;padding:11px 14px;background:rgba(240,149,149,.08);border:1px solid rgba(240,149,149,.4);border-radius:8px;color:#F09595;font-size:13px;cursor:pointer;display:flex;align-items:center;gap:8px;}
.a2 .cnt{margin-left:auto;font-size:11px;background:rgba(240,149,149,.15);border-radius:10px;padding:2px 8px;}

/* ===== 案3: フラット・左ボーダーアクセント ===== */
.a3{width:100%;padding:11px 14px;background:var(--nv8);border:none;border-left:3px solid #F09595;border-radius:0 8px 8px 0;color:#F09595;font-size:13px;cursor:pointer;display:flex;align-items:center;gap:8px;}
.a3 .cnt{margin-left:auto;font-size:11px;color:#F09595;opacity:.7;}

/* ===== 案4: カード型・問題数大きく ===== */
.a4{width:100%;padding:12px 14px;background:var(--nv7);border:1px solid rgba(240,149,149,.35);border-radius:10px;cursor:pointer;display:flex;align-items:center;gap:12px;text-align:left;}
.a4-icon{width:36px;height:36px;border-radius:8px;background:rgba(240,149,149,.12);display:flex;align-items:center;justify-content:center;font-size:18px;flex-shrink:0;}
.a4-text{}
.a4-title{font-size:13px;color:#F09595;font-weight:600;line-height:1.3;}
.a4-sub{font-size:11px;color:var(--tmu);margin-top:2px;}
.a4-cnt{margin-left:auto;font-size:20px;font-weight:700;color:#F09595;flex-shrink:0;}
.a4-cnt span{font-size:11px;font-weight:400;color:var(--tmu);}

/* ===== 案5: テキストリンク風・控えめ ===== */
.a5-wrap{width:100%;display:flex;justify-content:center;}
.a5{background:transparent;border:none;color:var(--tmu);font-size:12px;cursor:pointer;display:flex;align-items:center;gap:5px;padding:8px 0;border-bottom:1px dashed rgba(130,160,191,.3);}
.a5 .a5-icon{font-size:14px;}
.a5 .a5-cnt{color:#F09595;font-weight:600;}

/* ===== 案6: アウトライン + バッジ ===== */
.a6{width:100%;padding:10px 14px;background:transparent;border:1.5px solid rgba(240,149,149,.5);border-radius:8px;color:#F09595;font-size:13px;cursor:pointer;display:flex;align-items:center;gap:8px;}
.a6 .a6-badge{margin-left:auto;background:#F09595;color:#fff;font-size:10px;font-weight:700;border-radius:10px;padding:1px 7px;min-width:22px;text-align:center;}
</style>
</head>
<body>

<!-- 案1: 現在 -->
<div class="row">
  <div class="lbl"><b>現在</b>　アウトライン ピンク（比較用）</div>
  <button class="btn-train">▶ トレーニング開始</button>
  <button class="a1">📋 要復習リスト</button>
</div>

<!-- 案2: 薄い背景 + 件数バッジ -->
<div class="row">
  <div class="lbl"><b>案2</b>　薄い背景 ＋ 件数を右端に</div>
  <button class="btn-train">▶ トレーニング開始</button>
  <button class="a2">📋 要復習リスト <span class="cnt">12問</span></button>
</div>

<!-- 案3: 左ボーダーアクセント -->
<div class="row">
  <div class="lbl"><b>案3</b>　左ラインアクセント ＋ フラット</div>
  <button class="btn-train">▶ トレーニング開始</button>
  <button class="a3">📋 要復習リスト <span class="cnt">12問</span></button>
</div>

<!-- 案4: カード型 -->
<div class="row">
  <div class="lbl"><b>案4</b>　カード型・問題数を大きく</div>
  <button class="btn-train">▶ トレーニング開始</button>
  <button class="a4">
    <div class="a4-icon">📋</div>
    <div class="a4-text">
      <div class="a4-title">要復習リスト</div>
      <div class="a4-sub">まだ克服できていない問題</div>
    </div>
    <div class="a4-cnt">12<span>問</span></div>
  </button>
</div>

<!-- 案5: テキストリンク風 -->
<div class="row">
  <div class="lbl"><b>案5</b>　テキストリンク風・控えめ</div>
  <button class="btn-train">▶ トレーニング開始</button>
  <div class="a5-wrap">
    <button class="a5"><span class="a5-icon">📋</span> 要復習リスト（<span class="a5-cnt">12問</span>）</button>
  </div>
</div>

<!-- 案6: アウトライン + バッジ -->
<div class="row">
  <div class="lbl"><b>案6</b>　アウトライン ＋ 件数バッジ</div>
  <button class="btn-train">▶ トレーニング開始</button>
  <button class="a6">📋 要復習リスト <span class="a6-badge">12</span></button>
</div>

</body>
</html>
